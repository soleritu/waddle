[package]
name = "waddle"
version = "0.1.0-beta"
edition = "2021"
description = "Local AI hosting: llama.cpp's router, stable-diffusion.cpp, a Hugging Face browser, and a live dashboard"
license-file = "LICENSE.md"
repository = "https://github.com/soleritu/waddle"

[features]
default = ["window"]
# A native window and a tray icon. Without it, Waddle opens the dashboard in a browser instead.
window = ["dep:tao", "dep:wry", "dep:tray-icon", "dep:rfd", "dep:png"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
url = "2"
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
getrandom = "0.2"
png = { version = "0.17", optional = true }
sha2 = "0.10"
ignore = "0.4"
similar = "2"
rfd = { version = "0.15", default-features = false, features = ["gtk3"], optional = true }
tao = { version = "0.30", optional = true }
wry = { version = "0.47", optional = true }
tray-icon = { version = "0.19", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
