<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waddle</title>
<link rel="icon" href="{{ICON}}">
<style>
:root{
  color-scheme:light;
  --accent:#5b5bd6;
  --bg:#f7f7f8;--bg2:#fbfbfb;--panel:#ffffff;--sunk:#f3f3f5;--hover:#efeff1;--line:#e6e6e9;--line2:#d4d4d9;
  --text:#18181b;--dim:#52525b;--faint:#85858f;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#6250d6;--track:#ececf1;
  --good:#16794a;--warn:#8a5a00;--bad:#c0262d;--good-bg:#e2f5ea;--warn-bg:#fcf1d8;--bad-bg:#fde6e6;
  --shadow-sm:0 1px 2px rgba(16,16,32,.04);
  --shadow:0 .25rem 1rem rgba(16,16,32,.08),0 1px .1875rem rgba(16,16,32,.06);
  --shadow-lg:0 1.5rem 4rem rgba(16,16,32,.18),0 .25rem .75rem rgba(16,16,32,.08);
  --mono:"Cascadia Code","Cascadia Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r:.625rem;--r2:.875rem;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f0f11;--bg2:#131315;--panel:#18181b;--sunk:#1e1e22;--hover:#232327;--line:#27272b;--line2:#36363c;
  --text:#ededef;--dim:#b2b2ba;--faint:#7d7d87;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;--track:#23232c;
  --good:#5fd09a;--warn:#f0bd55;--bad:#ff8a8a;--good-bg:#12291e;--warn-bg:#2e2510;--bad-bg:#341719;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 .375rem 1.25rem rgba(0,0,0,.35),0 1px .1875rem rgba(0,0,0,.3);--shadow-lg:0 1.875rem 5rem rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f0f11;--bg2:#131315;--panel:#18181b;--sunk:#1e1e22;--hover:#232327;--line:#27272b;--line2:#36363c;
  --text:#ededef;--dim:#b2b2ba;--faint:#7d7d87;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;--track:#23232c;
  --good:#5fd09a;--warn:#f0bd55;--bad:#ff8a8a;--good-bg:#12291e;--warn-bg:#2e2510;--bad-bg:#341719;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 .375rem 1.25rem rgba(0,0,0,.35),0 1px .1875rem rgba(0,0,0,.3);--shadow-lg:0 1.875rem 5rem rgba(0,0,0,.6);
}
:root{--accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);--accent-line:color-mix(in srgb,var(--accent) 35%,transparent);--accent-text:color-mix(in srgb,var(--accent) 80%,var(--text))}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(clamp(15px, .3vw + 11.2px, 18px) * var(--ui-scale, 1))}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:.8438rem/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;display:flex;overflow:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text);text-decoration:none}a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:.7812rem}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:.625rem;height:.625rem}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:.625rem;border:.1875rem solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background-color:var(--faint)}
svg.i{width:1rem;height:1rem;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.lg{width:1.125rem;height:1.125rem}

/* ---------- sidebar ---------- */
#nav{width:15.25rem;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:.875rem .75rem .75rem;transition:width .25s var(--ease);position:relative;z-index:3}
body.mini #nav{width:3.5rem;padding:.75rem .5rem .625rem}
.group{font-size:.6875rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:.875rem .625rem .375rem;white-space:nowrap;overflow:hidden;transition:opacity .2s}
body.mini .group{opacity:0;height:.75rem;padding:0}
#tabs{position:relative;display:flex;flex-direction:column;gap:2px}
#ind{position:absolute;left:0;right:0;height:2.125rem;border-radius:.5rem;background:var(--hover);transition:transform .32s var(--ease),opacity .2s;pointer-events:none;z-index:0}
#ind::before{content:"";position:absolute;left:-.75rem;top:.5rem;bottom:.5rem;width:.1875rem;border-radius:0 .1875rem .1875rem 0;background:var(--accent)}
.tab{all:unset;position:relative;z-index:1;display:flex;align-items:center;gap:.6875rem;height:2.125rem;padding:0 .625rem;border-radius:.5625rem;cursor:pointer;color:var(--dim);font-weight:500;white-space:nowrap;transition:color .15s,background .15s}
.tab:hover{color:var(--text);background:var(--hover)}
.tab.on{color:var(--text);background:transparent;font-weight:600}.tab.on svg.i{color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tab .lbl{flex:1;overflow:hidden;transition:opacity .2s}
body.mini .tab .lbl,body.mini .tab .count{opacity:0;width:0}
.count{font-size:.6875rem;font-weight:600;min-width:1.25rem;height:1.125rem;padding:0 .375rem;border-radius:.5625rem;background:var(--sunk);color:var(--dim);display:grid;place-items:center}
.tab.on .count{background:var(--accent);color:#fff}
.navfoot{margin-top:auto;display:grid;gap:.5rem}
.svc{border:1px solid var(--line);background:var(--panel);border-radius:.75rem;padding:.625rem .75rem;display:grid;gap:.1875rem;font-size:.75rem;box-shadow:var(--shadow-sm);white-space:nowrap;overflow:hidden;transition:opacity .2s}
.svc b{display:flex;align-items:center;gap:.4375rem;font-size:.7812rem}
.svc span{color:var(--faint)}
body.mini .svc{padding:.5625rem 0;justify-items:center;border-radius:.625rem}body.mini .svc>span,body.mini .svc .t{display:none}body.mini .svc b{gap:0}body.mini .brand{padding:2px 1px .875rem}body.mini .brand>div:not(.logo),body.mini .collapse span{display:none}body.mini .collapse{justify-content:center;padding:.4375rem 0}body.mini .tab{padding:0 .6875rem}
.collapse{all:unset;display:flex;align-items:center;gap:.625rem;padding:.4375rem .625rem;border-radius:.5625rem;color:var(--faint);cursor:pointer;font-size:.7812rem;white-space:nowrap}
.collapse:hover{background:var(--hover);color:var(--text)}
body.mini .collapse svg{transform:rotate(180deg)}

/* ---------- top bar ---------- */
#shell{flex:1;min-width:0;display:flex;flex-direction:column}
#top{height:3.75rem;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.875rem;padding:0 1.5rem;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(.75rem);position:relative;z-index:2}
#top .ttl{min-width:0}
#top h1{font-size:1rem;margin:0;font-weight:650;letter-spacing:-.015em}
#top .crumb{font-size:.75rem;color:var(--faint)}
.search{all:unset;display:flex;align-items:center;gap:.5625rem;height:2.125rem;padding:0 .625rem 0 .75rem;width:18.75rem;max-width:32vw;border:1px solid var(--line);border-radius:.5625rem;background:var(--panel);color:var(--faint);cursor:pointer;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s;margin-left:auto}
.search:hover{border-color:var(--line2)}
.search span{flex:1}
kbd{font:600 .6562rem var(--mono);padding:2px .375rem;border-radius:.3125rem;border:1px solid var(--line2);border-bottom-width:2px;color:var(--dim);background:var(--sunk)}
#page{flex:1;min-height:0;overflow:auto;padding:1.375rem 1.5rem 3rem;scroll-behavior:smooth}
.view{animation:enter .32s var(--ease) both;margin:0 auto}
#top .crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#top .ttl{flex:1}
@media (max-width:1400px){.ibar .imgurl{display:none}}
@keyframes enter{from{opacity:0;transform:translateY(.375rem)}to{opacity:1;transform:none}}

/* ---------- parts ---------- */
.grid{display:grid;gap:1rem}
.g4{grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(26rem,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(19rem,100%),1fr))}
.mt{margin-top:1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow-sm);min-width:0;transition:box-shadow .2s,border-color .2s}
.card>header{display:flex;align-items:center;gap:.625rem;padding:.8125rem 1rem;border-bottom:1px solid var(--line);min-height:3.25rem}
.card>header h2{font-size:.8125rem;margin:0;font-weight:620;flex:1;display:flex;align-items:center;gap:.5625rem;letter-spacing:-.005em}
.card>header h2 .ic{width:1.25rem;height:1.25rem;display:grid;place-items:center;color:var(--faint)}
.card>header .meta{color:var(--faint);font-size:.75rem}
.card .body{padding:.875rem 1rem}
.tile{padding:.875rem 1rem .8125rem;position:relative;overflow:hidden}
.tile .k{color:var(--dim);font-size:.75rem;font-weight:500;display:flex;align-items:center;gap:.4375rem}
.tile .k .ic{color:var(--faint)}
.tile .v{font-size:1.5rem;font-weight:650;margin-top:.25rem;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:.8125rem;color:var(--faint);font-weight:500;letter-spacing:0}
.tile .s{color:var(--faint);font-size:.75rem;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:.3125rem;border-radius:.1875rem;background:var(--track);margin-top:.6875rem;overflow:hidden}
.meter i{display:block;height:100%;border-radius:.1875rem;background:var(--accent);transition:width .6s var(--ease)}
.spark{position:absolute;right:.75rem;top:.75rem;width:4rem;height:1.5rem;opacity:.75;pointer-events:none}
.tile .k{padding-right:4.375rem}
.kvf{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.375rem,1fr));gap:.625rem .75rem}
.empty .btn svg.i{width:.9375rem;height:.9375rem;margin:0;opacity:1}
.note{display:flex;align-items:center;gap:.5rem;padding:.5rem .625rem;font-size:.7812rem;color:var(--dim);background:var(--sunk);border:1px solid var(--line);border-radius:.625rem}

.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:.4375rem;height:2rem;padding:0 .8125rem;border:1px solid var(--line2);border-radius:.5rem;cursor:pointer;background:var(--panel);font-weight:560;font-size:.7812rem;white-space:nowrap;color:var(--text);box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,box-shadow .15s,transform .08s,filter .15s;user-select:none}
.btn:hover{background:var(--hover);border-color:var(--line2)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
.btn.p:hover{background:color-mix(in srgb,var(--accent) 88%,#000);border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--dim)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.d{color:var(--bad)}
.btn.d.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:1.75rem;padding:0 .625rem;font-size:.75rem;border-radius:.4375rem}
.btn.icon{width:2rem;padding:0}.btn.icon.sm{width:1.75rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.busy{pointer-events:none;color:transparent!important;position:relative}
.btn.busy::after{content:"";position:absolute;width:.875rem;height:.875rem;border-radius:50%;border:2px solid currentColor;border-color:var(--faint) transparent var(--faint) var(--faint);animation:spin .7s linear infinite}
.btn.p.busy::after{border-color:#fff transparent #fff #fff}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.sub{color:var(--faint);font-size:.75rem}
.badge{display:inline-flex;align-items:center;gap:.375rem;height:1.375rem;padding:0 .5625rem;border-radius:6.1875rem;font-size:.7188rem;font-weight:600;border:1px solid var(--line2);color:var(--dim);white-space:nowrap;background:var(--panel)}
.badge.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.tag{display:inline-flex;align-items:center;height:1.25rem;padding:0 .4375rem;border-radius:.375rem;font-size:.6875rem;font-weight:550;background:var(--sunk);color:var(--dim);white-space:nowrap}
.dot{width:.4375rem;height:.4375rem;border-radius:50%;background:var(--faint);flex:none}
.dot.good{background:var(--good);box-shadow:0 0 0 .1875rem color-mix(in srgb,var(--good) 20%,transparent)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.dot.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
input[type=text],input[type=number],input:not([type]),select,textarea{height:2.125rem;background:var(--panel);border:1px solid var(--line2);border-radius:.5rem;padding:0 .6875rem;outline:none;min-width:0;transition:border-color .15s,box-shadow .15s}
select{padding-right:1.75rem;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - .9375rem) .9375rem,calc(100% - .625rem) .9375rem;background-size:.3125rem .3125rem;background-repeat:no-repeat;cursor:pointer}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 .1875rem var(--accent-soft)}
.field{display:grid;gap:.3125rem}.field>span{font-size:.75rem;font-weight:550;color:var(--dim)}
.switch{position:relative;display:inline-flex;align-items:center;gap:.5625rem;cursor:pointer;user-select:none;color:var(--dim);white-space:nowrap}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch i{width:2.125rem;height:1.25rem;border-radius:6.1875rem;background:var(--line2);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:1rem;height:1rem;border-radius:50%;background:#fff;box-shadow:0 1px .1875rem rgba(0,0,0,.3);transition:transform .22s var(--ease)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(.875rem)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.check{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;color:var(--dim);white-space:nowrap}
.check input{width:1rem;height:1rem;accent-color:var(--accent);cursor:pointer;margin:0}
.seg{position:relative;display:inline-flex;padding:.1875rem;border-radius:.5625rem;background:var(--sunk);border:1px solid var(--line)}
.seg button{all:unset;position:relative;z-index:1;height:1.625rem;padding:0 .8125rem;display:inline-flex;align-items:center;gap:.375rem;cursor:pointer;color:var(--dim);font-weight:560;font-size:.7812rem;border-radius:.375rem;transition:color .2s}
.seg button.on{color:var(--text)}
.seg .thumb{position:absolute;top:.1875rem;bottom:.1875rem;border-radius:.375rem;background:var(--panel);box-shadow:var(--shadow-sm),0 0 0 1px var(--line);transition:left .28s var(--ease),width .28s var(--ease)}
.empty{color:var(--faint);padding:2rem 1rem;text-align:center;display:grid;justify-items:center;gap:.5rem}
.empty svg{width:1.75rem;height:1.75rem;stroke-width:1.5;opacity:.6}
.skel{border-radius:.375rem;background:linear-gradient(90deg,var(--sunk) 0%,var(--hover) 50%,var(--sunk) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;height:.75rem}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- tables ---------- */
.tw{overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0}
th{text-align:left;font-size:.6875rem;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:.5625rem .875rem;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0;z-index:1}
td{padding:.625rem .875rem;border-bottom:1px solid var(--line);vertical-align:middle;transition:background .12s}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--hover)}
tbody tr.sel td{background:var(--accent-soft)}
tbody tr.sel td:first-child{box-shadow:inset .1875rem 0 0 var(--accent)}
.name{font-weight:600;overflow-wrap:anywhere}
.tags{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.25rem}

/* ---------- charts ---------- */
.chart{position:relative;height:10.625rem}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:.5625rem;padding:.4375rem .625rem;font-size:.75rem;box-shadow:var(--shadow);white-space:nowrap;z-index:2;transition:left .08s linear}
.chart .tip b{font-weight:650}
.legend{display:flex;gap:.875rem;font-size:.75rem;color:var(--dim)}
.legend i{display:inline-block;width:.625rem;height:.1875rem;border-radius:2px;margin-right:.375rem;vertical-align:middle}
.stack{display:flex;height:.75rem;border-radius:.375rem;overflow:hidden;gap:2px;background:var(--track)}
.stack i{display:block;height:100%;transition:width .6s var(--ease)}
.keys{display:flex;flex-wrap:wrap;gap:.375rem 1rem;margin-top:.625rem;font-size:.75rem;color:var(--dim)}
.keys span::before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:2px;margin-right:.375rem;background:var(--c);vertical-align:0}
.slot{display:grid;grid-template-columns:3.5rem 1fr 10.625rem;gap:.75rem;align-items:center;padding:.375rem 0;font-size:.7812rem}
.slot .bar{height:.5rem;background:var(--track);border-radius:.25rem;overflow:hidden;display:flex;gap:2px}
.slot .bar i{display:block;height:100%;transition:width .6s var(--ease)}

/* ---------- layouts ---------- */
.hub{display:grid;grid-template-columns:16.25rem minmax(0,1fr);gap:1rem;align-items:start}
.facets{position:sticky;top:0;display:grid;gap:.875rem;padding:1rem}
.facets h3{margin:0;font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.facets .range{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.facets .opts{display:grid;gap:.5625rem}
pre.log{margin:0;padding:.875rem 1rem;font:.75rem/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;height:calc(100vh - 13.75rem);overflow:auto}
pre.log .e{color:var(--bad)}pre.log .w{color:var(--warn)}
pre.cardtext{margin:0;font:.75rem/1.6 var(--mono);white-space:pre-wrap;color:var(--dim)}
.kv{display:grid;grid-template-columns:minmax(7.5rem,10.625rem) 1fr 2rem;gap:.5rem;align-items:center}
.kv input{width:100%}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:.4375rem 1.125rem;margin:0;font-size:.7812rem}
dl.facts dt{color:var(--faint)}dl.facts dd{margin:0;overflow-wrap:anywhere}
.endpoint.pick{cursor:pointer}.endpoint.pick:hover{border-color:var(--line2)}.endpoint.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.endpoint{display:flex;align-items:center;gap:.625rem;padding:.5rem .5rem .5rem .75rem;border:1px solid var(--line);border-radius:.625rem;background:var(--sunk);margin-bottom:.5rem}
.endpoint code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.events{max-height:18.75rem;overflow:auto}
.ev{display:flex;gap:.75rem;padding:.5625rem 1rem;border-bottom:1px solid var(--line);font-size:.7812rem;align-items:baseline}
.ev:last-child{border-bottom:0}
.ev time{color:var(--faint);flex:none;width:3.625rem;font-size:.7188rem}
.ev .dot{transform:translateY(-1px)}
.setting{display:flex;align-items:center;gap:1rem;padding:.875rem 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}.setting:first-child{padding-top:2px}
.setting b{font-weight:600;font-size:.8125rem}
.hero{padding:1.75rem;display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:center;background:radial-gradient(120% 140% at 0% 0%,var(--accent-soft),transparent 60%),var(--panel)}
.hero h2{margin:0 0 .375rem;font-size:1.25rem;letter-spacing:-.02em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(13.75rem,1fr));gap:.75rem;margin-top:1.125rem}
.step{border:1px solid var(--line);border-radius:.75rem;padding:.875rem;background:var(--panel);display:grid;gap:.375rem}
.step .n{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:var(--accent-soft);color:var(--accent-text)}

/* ================= talking to Waddle ================= */
async function api(name, body={}){
  let r;
  try{ r = await fetch("/api/"+name, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}); }
  catch{ throw new Error("Waddle isn't answering. It may have been closed or is restarting; open it again from its icon."); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}
function toast(text, bad=false, action=null){
  // longer messages stay longer, so there's time to read the reason and the fix; one with a button stays longer still
  const t = document.createElement("div"), life = Math.max(bad ? 6500 : 3200, String(text).length * 55) + (action ? 6000 : 0);
  t.className = "toast" + (bad ? " bad" : ""); t.style.setProperty("--life", life+"ms");
  t.innerHTML = `<div class="ti">${ic(bad ? "alert" : "check")}</div><div class="grow">${esc(text)}</div>${action ? `<button class="btn sm">${esc(action.label)}</button>` : ""}`;
  if (action) $("button", t).onclick = () => { action.run(); t.remove(); };
  $("#toasts").prepend(t);
  const gone = () => { t.classList.add("out"); setTimeout(() => t.remove(), 260); };
  t.onclick = gone; setTimeout(gone, life);
}
async function act(name, body={}, btn){
  btn?.classList.add("busy");
  try{ const d = await api(name, body); if (d.message) toast(d.message); refresh(); return d; }
  catch(e){ toast(e.message, true); }
  finally{ btn?.classList.remove("busy"); }
}
function modal(title, html, buttons=""){
  const m = $("#modal");
  $(".box", m).innerHTML = `<header><h2>${esc(title)}</h2><button class="btn icon sm ghost" data-close>${ic("x")}</button></header><div class="mbody">${html}</div>${buttons ? `<footer>${buttons}</footer>` : ""}`;
  m.classList.add("on"); $("#scrim").classList.add("on");
}
function closeAll(){ $("#modal").classList.remove("on"); $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); $("#palette").classList.remove("on"); drawerFor = null; }

async function refresh(){
  try{ S = await api("state"); }
  catch(e){ put($("#status"), `<span class="badge bad"><span class="dot bad"></span>Not connected</span>`); return; }
  // the first time, and whenever there's nothing to run yet, start with setup
  if (!refresh.once){ refresh.once = true; if (!store.get("setup.done", false) && (!S.server || !S.models.length) && page !== "setup") return go("setup"); }
  frame(); draw();
  if (S.problem) toast(S.problem, true, /image|picture|stable-diffusion|sd-server/i.test(S.problem) ? {label: "Open the image log", run: () => { VIEWS.logs.name = "image.log"; VIEWS.logs.text = null; go("logs"); }} : /load|model server|router|llama/i.test(S.problem) ? {label: "Open the model log", run: () => { VIEWS.logs.name = "router.log"; VIEWS.logs.text = null; go("logs"); }} : null);
  // once a day, when chosen in Settings: new releases
  if (S.settings.check_updates && !refresh.checked && Date.now() - store.get("upd.last", 0) > 864e5){ refresh.checked = true; store.set("upd.last", Date.now());
    api("updates").then(u => { UPD = u; const n = [u.waddle_latest && u.waddle_latest !== S.version, u.llama_latest && u.llama_latest !== S.llama && S.server, u.sd_latest && u.sd_latest !== S.image.version && S.image.installed].filter(Boolean).length; if (n) toast(`${n} update${n > 1 ? "s are" : " is"} available.`, false, {label: "See updates", run: () => go("settings")}); }).catch(() => {}); }
}
// Once per load: when shared GPU memory grows by half a gigabyte or more while a model is loaded,
// the model has spilled out of VRAM and runs much slower. Say so, with where to fix it.
const SPILL = {model: "", base: null, told: ""};
function spillWatch(){
  const m = loadedModel(), s = last(); if (!s || !S) return;
  if (!m || m.status !== "loaded"){ SPILL.model = ""; SPILL.base = null; return; }
  if (SPILL.model !== m.name){ SPILL.model = m.name; SPILL.base = s.gpu?.shared ?? 0; return; }
  const grew = (s.gpu?.shared ?? 0) - (SPILL.base ?? 0);
  if (grew >= 0.5 && SPILL.told !== m.name + ":" + m.live_context){
    SPILL.told = m.name + ":" + m.live_context;
    toast(`${m.name} spilled ${grew.toFixed(1)} GB out of video memory, so it runs much slower. Lower its context, or use a q8_0 context cache.`, true, {label: "Open its settings", run: () => { go("models"); setTimeout(() => modelDrawer(m.name, "settings"), 300); }});
  }
}

    meta = r; L = L.concat(r.samples).slice(-300);
    spillWatch();
    if (S && L.length) VIEWS[page].live?.();
  }catch{}
  setTimeout(pollLive, 1000);
}

function frame(){
  const active = S.downloads.filter(d => d.state !== "done").length;
  for (const [id, n] of [["models", S.models.length], ["downloads", active]]){ const el = $(`#n-${id}`); if (el){ el.hidden = !n; el.textContent = n; } }
  const m = loadedModel(), img = S.image.state, jobs = S.jobs || [];
  put($("#status"), !S.server ? `<span class="badge warn"><span class="dot warn"></span>Setup needed</span>`
    : jobs.length ? `<span class="badge warn" title="${esc(jobs.join(", "))}|Running beside the model server${m ? `, while ${esc(m.name)} is ${esc(m.status)}` : ""}."><span class="dot warn pulse"></span>${esc(jobs[0])}…${m ? ` · ${esc(m.name)}` : ""}</span>`
    : img === "loading" ? `<span class="badge warn"><span class="dot warn pulse"></span>Loading the image model…</span>`

    for (const se of series) if (se.values[i] != null) s += `<circle cx="${px}" cy="${y(se.values[i])}" r="4" fill="${se.color}" stroke="${css("--panel")}" stroke-width="2"/>`;

  }

}

          <div class="row" style="margin-top:.75rem"><label class="switch" title="Blind|Answers are labelled A, B, C, and names are hidden everywhere until you vote, so you judge the result, not the name."><input type="checkbox" id="ablind" ${V.blind ? "checked" : ""}><i></i>Blind</label><div class="grow"></div><span class="sub" id="astat"></span><button class="btn p" id="ago">${ic("play")}Run</button></div></div>`, "", "", "Ask several models the same thing and compare answers, speed, and length side by side. Your votes build a leaderboard of what works for you.")}
        ${card("Leaderboard", "star", `<div class="body" style="padding-bottom:0"><div class="row" style="gap:.375rem"><select id="abtopic" style="flex:1"><option value="">Every topic</option>${(V.board?.topics || []).map(t => `<option ${V.btopic === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select><button class="btn sm ghost" data-aexport title="Export|Saves every comparison to exports/.">${ic("dl")}</button><button class="btn sm ghost" data-areset title="Reset|Forgets every ${pics ? "picture" : "text"} comparison. A copy is kept in backups/.">${ic("trash")}</button></div></div><div class="tw" id="aboard"></div><details class="ahist"><summary>Past comparisons</summary><div id="ahist"></div></details>`, "", "", "Ratings from your votes, Elo-style: beating a strong contestant counts for more than beating a weak one. Every contestant starts at 1000.")}
      </div><div id="nopeek" class="mt" hidden><img src="${LOGO}" alt=""><span><b>No peeking!</b> Names are hidden until you vote.</span></div><div id="aitems"></div><div id="afollow"></div>`;
    },
    once(){ segThumb($("#akind")); arenaBoard(); arenaCons(); arenaDraw(); promptsLoad("#apromptpick"); if (this.kind === "image" && !IMG.files) api("images/files").then(f => { IMG.files = f; arenaCons(); }).catch(() => {}); },
  },

  playground: {
    tab: "generate", out: null,
    shell(){
      const V = this, ms = textModels(), p = store.get("pg", {}), tabs = [["generate", "Generate"], ["tokens", "Tokenizer"], ["template", "Prompt template"]];
      const slider = (k, l, min, max, step, def, tip) => `<label class="slider" title="${esc(l + "|" + tip)}"><span>${l}</span><input type="range" min="${min}" max="${max}" step="${step}" data-pg="${k}" value="${p[k] ?? def}"><output>${p[k] ?? def}</output></label>`;
      return `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button data-pgtab="${k}" class="${V.tab === k ? "on" : ""}">${l}</button>`).join("")}</div>
      ${V.tab === "generate" ? `<div class="grid g2" style="grid-template-columns:minmax(16.25rem,1fr) minmax(0,2fr)">
        ${card("Settings", "sliders", `<div class="body grid" style="gap:.75rem">
          <label class="field"><span>Model</span><select id="pgmodel">${ms.map(m => `<option ${p.model === m.name ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select></label>
          <div class="seg" id="pgmode" title="Mode|Chat applies the model's chat template, as apps do. Raw sends your text as it is, so you see what the model itself continues."><span class="thumb"></span><button data-pgmode="chat" class="${(p.mode || "chat") === "chat" ? "on" : ""}">Chat</button><button data-pgmode="raw" class="${p.mode === "raw" ? "on" : ""}">Raw completion</button></div>
          ${slider("temperature", "Temperature", 0, 2, .05, .7, "Randomness. 0 always picks the most likely token; 1 follows the model's own odds; higher is wilder.")}
          ${slider("max_tokens", "Max tokens", 16, 4096, 16, 512, "The longest answer allowed.")}
          <label class="switch" title="Token probabilities|Colours each token by how sure the model was, from green (certain) to red (a coin flip). Hover a token to see what else it considered."><input type="checkbox" id="pgprobs" ${p.probs !== false ? "checked" : ""}><i></i>Show how sure it was</label>
          <details class="adv"${p.adv ? " open" : ""} id="pgadv"><summary>More sampling settings</summary><div style="display:grid;gap:.625rem;margin-top:.5rem">
          ${slider("top_p", "Top-p", 0, 1, .01, .95, "Only tokens within this share of the probability are considered. Lower is more focused.")}
          ${slider("top_k", "Top-k", 0, 200, 1, 40, "Only the k most likely tokens are considered. 0 means no limit.")}
          ${slider("min_p", "Min-p", 0, .5, .01, .05, "Drops tokens less likely than this fraction of the top token. A modern, gentle cut-off.")}
          ${slider("repeat_penalty", "Repeat penalty", .8, 1.5, .01, 1, "Makes recent tokens less likely, to stop loops. 1 is off.")}
          <label class="field" title="Seed|The same seed with the same settings gives the same answer, so you can change one setting and see its effect. Empty is random."><span>Seed</span><input id="pgseed" type="number" placeholder="Random" value="${esc(p.seed ?? "")}"></label>
          <label class="field" title="Stop sequences|The answer ends as soon as the model writes one of these. One per line."><span>Stop at</span><textarea id="pgstop" rows="2" class="code" placeholder="One per line, such as ###">${esc(p.stop || "")}</textarea></label>
          <label class="field" title="Logit bias|Makes words more or less likely. One per line: a word, then a number from -100 (never) to 100 (always), such as  sorry = -10"><span>Word bias</span><textarea id="pgbias" rows="2" class="code" placeholder="sorry = -10">${esc(p.bias || "")}</textarea></label>
          <button class="btn sm ghost" data-pgreset title="Put every setting back to its default.">${ic("refresh")}Reset to defaults</button></div></details>
          <label class="field" title="Structured output|Forces the answer to follow a format. llama.cpp enforces it token by token, so the output always parses."><span>Output format</span><select id="pgformat">${[["", "Free text"], ["json", "Any JSON"], ["schema", "JSON schema"], ["grammar", "GBNF grammar"]].map(([v, l]) => `<option value="${v}" ${(p.format || "") === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
          <textarea id="pgschema" class="code" style="height:7.5rem" ${p.format === "schema" || p.format === "grammar" ? "" : "hidden"} placeholder='${p.format === "grammar" ? "root ::= \"yes\" | \"no\"" : "{\"type\": \"object\", \"properties\": {\"answer\": {\"type\": \"string\"}}, \"required\": [\"answer\"]}"}'>${esc(p.schema || "")}</textarea>
`)}
        ${card("Prompt", "edit", `<div class="body grid" style="gap:.75rem">
          <div class="row" style="gap:.375rem"><select id="pgsess" style="flex:1" title="Saved sessions|Playground setups you saved: every setting, the prompt, and the answer."><option value="">Saved sessions…</option></select><button class="btn sm ghost" data-pgsave title="Save this setup under a name.">${ic("plus")}Save</button><button class="btn sm ghost" data-pgdel title="Delete the chosen session.">${ic("trash")}</button>
            <label class="check sub" title="Compare two settings|Runs the same prompt twice, with your settings (A) and with the changes you set for B, side by side."><input type="checkbox" id="pgab" ${p.ab ? "checked" : ""}>A/B</label></div>
          <div id="pgbbox" class="pgb" ${p.ab ? "" : "hidden"}><b>B changes</b>${[["temperature", "Temperature"], ["top_p", "Top-p"], ["top_k", "Top-k"], ["min_p", "Min-p"], ["seed", "Seed"]].map(([k, l]) => `<label class="field"><span>${l}</span><input type="number" step="any" data-pgb="${k}" value="${esc(p.b?.[k] ?? "")}" placeholder="Same as A"></label>`).join("")}</div>
          <input id="pgsys" placeholder="System prompt (Chat mode)" value="${esc(p.sys || "")}" ${p.mode === "raw" ? "hidden" : ""}>
          <textarea id="pgprompt" rows="6" style="height:auto;padding:.625rem .75rem;resize:vertical;font-family:${p.mode === "raw" ? "var(--mono)" : "inherit"}" placeholder="${p.mode === "raw" ? "Text for the model to continue, such as: The three laws of robotics are" : "Your message"}">${esc(p.prompt || "")}</textarea>
          <div class="row"><button class="btn ghost sm" data-pgcurl title="Copy as curl|The exact request, as a command you can run or put in a bug report. The key is left as a placeholder.">${ic("copy")}Copy as curl</button><div class="grow"></div><span class="sub" id="pgstat"></span><button class="btn p" id="pggo">${ic("play")}Generate</button></div>
          <div class="pgouts${p.ab ? " ab" : ""}"><div id="pgoutb" class="pgout" ${p.ab ? "" : "hidden"}></div><div id="pgout" class="pgout"><span class="hint-out">The answer appears here. With "Show how sure it was" on, each token is tinted from green (certain) to red (a guess); hover one to see what else the model considered.</span></div></div></div>`, "", "", "Try one request with full control: sampling, format, and what the model actually saw and chose.")}
      </div>` : V.tab === "tokens" ? card("Tokenizer", "layers", `<div class="body grid" style="gap:.75rem">
          <div class="row"><select id="tkmodel">${ms.map(m => `<option>${esc(m.name)}</option>`).join("")}</select><span class="sub grow">Each model splits text differently. Context sizes and speeds are counted in these tokens.</span></div>
          <textarea id="tktext" rows="5" style="height:auto;padding:.625rem .75rem;resize:vertical" placeholder="Paste any text">${esc(store.get("tk", "Waddle runs language models locally. Grüß Gott! 日本語もOK. function add(a, b) { return a + b; }"))}</textarea>
          <div class="row"><span class="sub grow" id="tkstat"></span><button class="btn p" id="tkgo">Split into tokens</button></div><div class="tokens" id="tkout"></div></div>`, "", "", "Shows how a model's tokenizer breaks text into tokens, the units it reads and writes.")
      : card("Prompt template", "file", `<div class="body grid" style="gap:.75rem">
          <div class="row"><select id="ptmodel">${ms.map(m => `<option>${esc(m.name)}</option>`).join("")}</select><span class="sub grow">The exact text the model receives for a conversation, after its chat template is applied.</span></div>
          <input id="ptsys" placeholder="System prompt" value="You are a helpful assistant."><textarea id="ptuser" rows="3" style="height:auto;padding:.625rem .75rem">Hello! What can you do?</textarea>
          <div class="row"><div class="grow"></div><button class="btn p" id="ptgo">Render</button></div><pre class="log" id="ptout" style="min-height:7.5rem;white-space:pre-wrap"></pre></div>`, "", "", "Chat templates decide where the system prompt, turns, and special tokens go. A wrong template is a common cause of odd answers.")}`;
    },
    once(){ segThumb($("#pgmode")); pgSessions(); },
  },

  speech: {
    once(){ ttsWarn(); ttsVoices(); ttsHistory(); },
    shell: () => `<div class="grid g2">
      ${card("Speech to text", "mic", `<div class="body grid" style="gap:.75rem">
        <label class="field"><span>Model${info("A model that hears: its projector (mmproj) has an audio encoder, as with Gemma 4, Voxtral, or Qwen2.5-Omni. Find them under Find models › Audio.")}</span><select id="sttmodel">${hearing().map(m => `<option>${esc(m.name)}</option>`).join("") || `<option value="">None yet</option>`}</select></label>
        ${hearing().length ? "" : `<div class="note row" style="gap:.5rem">${ic("info")}<span class="grow">No model here can hear yet. A model hears through a projector (mmproj) with an audio encoder: give one to a model such as Gemma 4 in its panel, or find an audio model.</span><button class="btn sm ghost" data-page="models">${ic("models")}My models</button><button class="btn sm" data-hubkind="audio">${ic("search")}Find one</button></div>`}
        <div class="row"><button class="btn p" id="sttrec">${ic("mic")}Record</button><label class="switch" title="Live|Writes the words down every few seconds while you record, instead of all at once at the end."><input type="checkbox" id="sttlive" ${store.get("stt.live", false) ? "checked" : ""}><i></i>Live</label><button class="btn" data-sttfile>${ic("file")}Choose an audio file</button><input type="file" id="sttpick" accept="audio/wav,audio/mpeg,audio/mp3,.wav,.mp3" hidden><span class="sub" id="sttstat"></span></div>
        <label class="field"><span>Instruction</span><input id="sttask" value="Transcribe this audio exactly. Reply with the transcript only."></label>
        <div class="md pgout" id="sttout"><span class="hint-out">The transcript appears here.</span></div></div>`, "", "", "Records or loads audio and asks an audio-capable model about it. Recording needs microphone permission the first time.")}
      ${card("Text to speech", "volume", `<div class="body grid" style="gap:.75rem">
        <label class="field"><span>Voice model${info("A text-to-speech model run by llama-tts. It also needs its codec, a second file from the same repository. Find them under Find models › Speech.")}</span><div id="ttswarn"></div><select id="ttsmodel">${(S?.models || []).filter(m => m.kind === "tts").map(m => `<option>${esc(m.name)}</option>`).join("") || `<option value="">None yet</option>`}</select></label>
        ${(S?.models || []).some(m => m.kind === "tts") ? "" : `<div class="note row" style="gap:.5rem">${ic("info")}<span class="grow">No voice model yet.</span><button class="btn sm" data-hubkind="tts">${ic("search")}Find one</button></div>`}
        <textarea id="ttstext" rows="4" style="height:auto;padding:.625rem .75rem" placeholder="Text to read aloud"></textarea>
        <div class="row" style="gap:.75rem;align-items:flex-end">
          <label class="field" style="flex:2;min-width:12rem"><span>Voice${info("The voice it speaks in. Models that copy voices, such as Qwen3-TTS, take a recording of someone speaking, 30 seconds at most. A few models have voices built in, picked by name.")}</span><select id="ttsvoicepick"><option value="">The model's own voice</option></select></label>
          <label class="field" style="flex:1;min-width:8rem"><span>Language${info("For models that take one, such as Qwen3-TTS. Automatic leaves it to the model.")}</span><select id="ttslang">${[["", "Automatic"], ["en", "English"], ["zh", "Chinese"], ["de", "German"], ["es", "Spanish"], ["fr", "French"], ["it", "Italian"], ["pt", "Portuguese"], ["ru", "Russian"], ["ja", "Japanese"], ["ko", "Korean"]].map(([v, l]) => `<option value="${v}" ${store.get("tts.lang", "") === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        </div>
        <input id="ttsvoice" placeholder="Built-in voice name, such as giovanni" hidden>
        <div class="row" style="gap:.5rem"><button class="btn sm" id="tvrec" title="Record a voice|Read anything aloud for 10 to 30 seconds in a quiet room. The model copies how it sounds.">${ic("mic")}Record a voice</button><button class="btn sm" data-tvfile title="Add a recording|A WAV or MP3 of one person speaking, 30 seconds at most.">${ic("upload")}Add a recording</button><input type="file" id="tvpick" accept="audio/wav,audio/mpeg,.wav,.mp3" hidden><button class="btn sm ghost" id="tvdel" hidden>${ic("trash")}Delete this voice</button><div class="grow"></div><span class="sub" id="ttsstat"></span><button class="btn p" id="ttsgo">${ic("volume")}Speak</button></div>
        <div id="tvnew" class="note" style="display:grid;gap:.625rem;align-items:stretch" hidden>
          <b>New voice</b>
          <audio id="tvplay" controls style="width:100%"></audio>
          <label class="field"><span>Name</span><input id="tvname" maxlength="40" placeholder="For example: My voice"></label>
          <label class="field"><span>Words spoken in it (optional)${info("With the exact words, Qwen3-TTS copies the voice more closely. Write them yourself, or let a model that hears write them down.")}</span><textarea id="tvwords" rows="2" style="height:auto;padding:.5rem .75rem" placeholder="What the recording says, word for word"></textarea></label>
          <div class="row" style="gap:.5rem"><button class="btn sm ghost" id="tvwrite">${ic("mic")}Write them down</button><div class="grow"></div><button class="btn sm ghost" id="tvcancel">Cancel</button><button class="btn sm p" id="tvsave">${ic("check")}Save voice</button></div>
        </div>
        <details class="adv" id="ttsmore" ${store.get("tts.more", false) ? "open" : ""}><summary>More settings</summary><div style="display:grid;gap:.75rem;margin-top:.75rem">
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.75rem">${ttsFields()}</div>
          <p class="sub" style="margin:0">Without a recording, a model such as Qwen3-TTS makes up a voice, a new one each time. The same seed with the same text gives the same voice. To keep a voice for every text, press <b>Keep this voice</b> on a result you like.</p>
          <div class="row"><button class="btn sm ghost" data-ttsreset>${ic("refresh")}Back to defaults</button></div>
        </div></details>
        <div class="row" style="gap:.5rem;margin-top:.25rem"><b class="grow">Made here <span class="sub" id="ttssize"></span></b><select id="ttskeep" style="width:auto" title="Keep spoken audio|Results pile up in the audio folder. Choose how long they stay; saved voices are never deleted.">${[[0, "Keep until I delete"], [30, "Keep 30 days"], [7, "Keep 7 days"], [1, "Keep 1 day"]].map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select><button class="btn sm ghost" data-ttsclear>${ic("trash")}Delete all</button></div>
        <div id="ttsout" class="grid" style="gap:.5rem"></div></div>`, "", "", "Reads text aloud. Results are kept in the audio folder for as long as you choose below.")}
    </div>`,
  },

  search: {
    docs: [], chunks: [], once(){ seIndexes(); },
    shell: () => `<div class="grid g2" style="grid-template-columns:minmax(16.25rem,1fr) minmax(0,2fr)">
      ${card("Documents", "file", `<div class="body grid" style="gap:.75rem">
        <label class="field"><span>Embedding model${info("Turns text into vectors that capture meaning. Find one under Find models › Embedding; small ones are fast and work well.")}</span><select id="semodel">${(S?.models || []).filter(m => m.kind === "embedding").map(m => `<option>${esc(m.name)}</option>`).join("") || `<option value="">None yet</option>`}</select></label>
        ${(S?.models || []).some(m => m.kind === "embedding") ? "" : `<div class="note row" style="gap:.5rem">${ic("info")}<span class="grow">Search needs an embedding model. Small ones download in a minute.</span><button class="btn sm" data-hubkind="embedding">${ic("search")}Find one</button></div>`}
        <label class="field"><span>Reranker (optional)${info("Re-reads the best matches against the question for a sharper order. Find one under Find models › Reranker.")}</span><select id="sererank"><option value="">None</option>${(S?.models || []).filter(m => m.kind === "rerank").map(m => `<option>${esc(m.name)}</option>`).join("")}</select></label>
        <div class="row"><button class="btn" data-sefile>${ic("file")}Add files</button><input type="file" id="sepick" multiple hidden><span class="sub grow" id="sestat"></span></div>
        <div id="sedocs" class="sub"></div>
        <div class="row" style="gap:.375rem;border-top:1px solid var(--line);padding-top:.75rem"><select id="seidx" style="flex:1" title="Saved indexes|Documents you embedded and saved, ready to search again, or to use in Chat."><option value="">Saved indexes…</option></select><button class="btn sm" data-sesave title="Save these documents as an index, to search them again later or use them in Chat.">${ic("plus")}Save</button><button class="btn sm ghost" data-sedel title="Delete the chosen index.">${ic("trash")}</button></div></div>`, "", "", "Add text files: they're split into passages and embedded. Save them as an index to search again later, or to let Chat answer from them.")}
      ${card("Search", "search", `<div class="body grid" style="gap:.75rem"><div class="row" style="flex-wrap:nowrap"><input id="seq" placeholder="Ask a question about your documents" style="flex:1"><button class="btn p" id="sego">Search</button></div><div id="seout" class="grid" style="gap:.625rem"></div></div>`, "", "", "Finds the passages closest in meaning to your question, by cosine similarity. With a reranker, the top 20 are reordered by relevance.")}
    </div>`,
  },

  inspector: {
    rows: [], since: 0, timer: 0, found: null, keep: null,
    shell: () => `<div class="row ifilters" style="margin-bottom:.75rem;gap:.5rem"><div style="position:relative;flex:1;min-width:12rem">${ic("search")}<input id="iq" placeholder="Search requests: words in the prompt, the answer, a model…" style="width:100%;padding-left:2.125rem"></div>
        <select id="iapp" title="App|Only requests from this app."><option value="">Every app</option></select><select id="imodel" title="Model|Only requests for this model."><option value="">Every model</option></select>
        <label class="switch" title="Errors only|Only requests that failed, such as a wrong key or a model that wouldn't load."><input type="checkbox" id="ierr"><i></i>Errors only</label></div>
      ${card("Requests", "inspect", `<div class="tw" id="irows"></div>`, `<span class="meta" id="icount"></span><select id="ikeep" title="Keep|How many requests Waddle keeps. In memory, they're gone when Waddle closes. Saved to disk, they stay in logs/requests until you clear them or they're older than the days you choose."><option value="memory">Keep: last 200, in memory</option><option value="memory-1000">Keep: last 1000, in memory</option><option value="disk-30">Keep: 30 days, on disk</option><option value="disk-90">Keep: 90 days, on disk</option><option value="disk-0">Keep: everything, on disk</option></select><button class="btn sm ghost" data-iexport title="Export|Saves the kept requests to exports/ as JSON lines.">${ic("dl")}Export</button><button class="btn sm ghost" data-iclear title="Forget every kept request, including any saved on disk.">${ic("trash")}Clear</button>`, "",
      "Every request through Waddle, from apps and its own pages: what was sent, what came back, tokens, and time.")}`,
    once(){ const i = $("#iq").previousElementSibling; i.style.cssText = "position:absolute;left:.6875rem;top:.625rem;color:var(--faint)"; api("usage").then(u => { VIEWS.inspector.keep = u; const k = u.keep === "disk" ? `disk-${u.days_kept || 0}` : u.keep; const sel = $("#ikeep"); if (sel){ if (![...sel.options].some(o => o.value === k)) sel.insertAdjacentHTML("beforeend", `<option value="${k}">Keep: ${u.days_kept} days, on disk</option>`); sel.value = k; } }).catch(() => {}); inspectorPoll(); },
  },

  connect: {
    tab: "pi", off: new Set(),   // models left out of the settings; every model is in by default
    shell(){ return `<div class="grid g2" style="grid-template-columns:minmax(17.5rem,1fr) minmax(0,2fr)"><div class="grid" style="gap:1rem;align-content:start">
        ${card("Address and key", "link", `<div class="body" id="cnend"></div>`, "", "", "The address and key every app uses. OpenAI-compatible at /v1, and Anthropic-compatible at /v1/messages for tools that speak Claude's API.")}
        ${card("Keys", "shield", `<div class="body" id="cnkeys"><div class="skel" style="height:2.5rem"></div></div>`, "", "", "One key per app, so each can be revoked alone. Requests and Usage show which key each request used.")}
        ${card("Models", "models", `<div class="body" id="cnmodels"></div>`, "", "", "Ask for a model by its name. It loads on the first request; one model is loaded at a time.")}</div>
        ${card("Set up an app", "plug", `<div class="tabs" id="cntabs" role="tablist">${CONNECT.map(([k, l]) => `<button data-cntab="${k}" class="${this.tab === k ? "on" : ""}">${l}</button>`).join("")}</div><div class="body" id="cnbody"></div>`, "", "", "Ready-made settings for common apps, with your address, key, and models filled in.")}</div>`; },
    once(){ connectLoad(); },
  },

  setup: {
    step: 0, fits: null, found: null, picks: null,
    shell(){
      const V = this, steps = ["Your PC", "Models you have", "A first model", "Ready"];
      return `<div class="setup"><div class="steps2">${steps.map((_, i) => `<i class="${i <= V.step ? "on" : ""}"></i>`).join("")}</div><div id="setupbody"></div>
        <div class="row" style="justify-content:space-between"><button class="btn ghost" data-setupskip>Skip setup</button><div class="row">${V.step ? `<button class="btn" data-setupstep="${V.step - 1}">Back</button>` : ""}${V.step < 3 ? `<button class="btn p" data-setupstep="${V.step + 1}">Next</button>` : ""}</div></div></div>`;
    },
    once(){ setupDraw(); },
    update(){ if (this.step === 0) setupDraw(); },
  },

  overview: {
    once(){ spanLoad(); usageLoad(); adviceLoad(); },
    shell(){
      return `<div id="lowwarn"></div><div id="setup"></div><div class="grid g4" id="tiles">${tilesShell()}</div>
      <div class="grid g2 mt">

        ${card("Video memory", "layers", `<div class="body" id="memmap"></div>`, "", "", "How the graphics card's dedicated memory is shared out. The loaded model's part is estimated from its file and settings; the total is measured.")}

        ${chartCard("Memory", "mem", "c-ram", `<span class="meta" id="ram-meta"></span>`, "System RAM in use by every app. The scale ends at the total installed.")}
        ${chartCard("GPU", "gpu", "c-eng", `<div class="legend" id="eng-legend"></div><span class="meta" id="gpu-meta"></span>`, "Graphics processor load. On Windows each engine is shown apart: language models mostly use Compute, sometimes 3D.")}
        ${chartCard("VRAM", "layers", "c-vram", `<div class="legend"><span><i style="background:var(--s3)"></i>Dedicated</span><span><i style="background:var(--s4)"></i>Spilled to RAM</span></div>`, "Dedicated video memory in use, and how much has spilled into shared system memory. Any spill slows generation sharply: lower the context or close GPU-heavy apps.")}
        ${card("Usage", "bolt", `<div class="tw" id="usage"><div class="skel" style="height:3rem;margin:1rem"></div></div>`, `<span class="meta">last 7 days</span>`, "", "Requests and tokens per model and per day, from every app and from Waddle's own pages. Counts only: what was asked is never kept here.")}

        ${card("Since the model loaded", "gauge", `<div class="body" id="totals"></div>`, "", "", "Counters from the loaded model since it was loaded, as reported by llama.cpp's metrics.")}

    update(){
      const steps = [[S.server, "Install llama.cpp", "The engine that runs models. Waddle picks the build for your GPU.", S.installing.llama ? `<button class="btn sm busy">…</button><span class="sub">${esc(S.installing.llama)}</span>` : `<button class="btn p sm" data-install="llama">${ic("dl")}Install</button>`],
                     [S.models.length, "Get a model", "Search Hugging Face and pick a size that fits your GPU.", `<button class="btn sm" data-page="hub">${ic("search")}Browse models</button>`],
                     [S.router && S.models.length, "Chat, or connect your apps", `Open Chat, or point any OpenAI-compatible app at <code>${esc(S.endpoints[0].text)}</code>.`, `<button class="btn sm" data-page="chat">${ic("chat")}Open Chat</button>`]];

      if (false) put($("#lowwarn"), S.low_integrity ? `<div class="note warnbox row" style="gap:.75rem;margin-bottom:1rem">${ic("alert")}<span class="grow"><b>Waddle is running with limited rights.</b> Windows marked its folder "low integrity", so it can't open folders or links, show its tray icon, or replace older files. Fix needs one administrator approval, then a restart.</span><button class="btn p sm" data-lowfix>Fix</button></div>` : "");
      put($("#setup"), steps.every(s => s[0]) ? "" : `<section class="card hero" style="margin-bottom:1rem"><div><h2>Welcome to Waddle</h2><div class="dim">Three steps to serve your models to every app.</div>
        <div class="steps">${steps.map(([done, t, d, b], i) => `<div class="step${done ? " done" : ""}"><div class="row"><span class="n">${done ? ic("check") : i + 1}</span><b>${t}</b></div><div class="sub">${d}</div>${done ? "" : `<div class="row">${b}</div>`}</div>`).join("")}</div></div></section>`);
      put($("#endpoints"), S.endpoints.map(e => `<div class="endpoint"><span class="tag">${esc(e.label)}</span><code>${esc(e.text)}</code><button class="btn icon sm ghost" data-copy="${esc(e.text)}" title="Copy">${ic("copy")}</button></div>`).join("")
        + `<div class="endpoint"><span class="tag">Key</span><code id="keytext">${"•".repeat(24)}</code><button class="btn icon sm ghost" data-copykey title="Copy">${ic("copy")}</button></div>
        <p class="sub" style="margin:.25rem 0 0">OpenAI-compatible. Send a model's name and it loads. ${S.settings.share ? "Apps on this computer and your network can use it, with the key." : "Only apps on this computer can reach it. To use it from a phone or another computer, turn on Settings › Network access."} Images: <code>${esc(S.endpoints[0].image)}</code></p>`);
      put($("#events"), S.events.length ? S.events.slice().reverse().map(e => `<div class="ev"><time>${clock(e.t)}</time><span class="dot ${e.kind === "info" ? "" : e.kind}"></span><span>${esc(e.text)}</span></div>`).join("") : `<div class="empty">${ic("activity")}Nothing yet.</div>`);

      put($("#gpu-meta"), [g.temp != null ? `${Math.round(g.temp)} °C` : "", g.power != null ? `${Math.round(g.power)} W` : ""].filter(Boolean).join(" · "));

    },
  },

        const e = m.memory, total = S.totals.vram || 1;

        <td>${statusBadge(m)}</td><td class="mono">${esc(m.quant || "—")}</td><td class="num">${gb(m.size)}</td><td class="num">${num(m.live_context || m.context)}</td>
        <td style="min-width:10.625rem">${e ? (() => { const f = vramFit(e, total); return `<div class="row" style="gap:.625rem;flex-wrap:nowrap"${tipAttr(f.tip)}><div class="meter grow" style="margin:0"><i style="width:${Math.min(100, e.vram / total * 100)}%;background:var(--${f.tone})"></i></div><span class="sub" style="width:3.25rem;text-align:right;color:var(--${f.tone})">${e.vram} GB</span></div>`; })() : `<div class="skel" style="width:7.5rem"></div>`}</td>
        <td class="num">${m.kind === "tts" ? `<span class="sub">Runs in Speech</span>` : ["loaded","loading","sleeping"].includes(m.status) ? `<button class="btn sm" data-unload="${esc(m.name)}" title="Free the memory it uses. The next request for it loads it again.">${ic("stop")}Unload</button>` : `<button class="btn p sm" data-load="${esc(m.name)}" ${m.missing.length ? "disabled" : ""} title="Load it now, so the first request doesn't wait. Another loaded model may be unloaded.">${ic("play")}Load</button>`}</td></tr>`; }).join("")}</tbody></table>`
        : `<div class="empty">${ic("models")}<div>No models yet.</div><button class="btn p" data-page="hub">${ic("search")}Find models</button></div>`);
      if (!$("#impcard")) $("#mtable").closest(".card").insertAdjacentHTML("afterend", `<div class="mt" id="impcard">${card("Use models you already have", "folder", `<div class="body" id="impbody"><p class="sub" style="margin-top:0">Find models from Ollama, LM Studio, the Hugging Face cache, and other apps, or in any folder, and take them in without copying.</p><div class="row"><button class="btn" data-impscan>${ic("search")}Look for models</button><button class="btn ghost" data-impfolder>${ic("folder")}Choose a folder…</button></div></div>`, "", "", "Files on the same drive are hard-linked: they appear in Waddle's models folder but take no extra space, and deleting the other app's copy keeps Waddle's. Settings another Waddle-style app worked out (ai.ini or models.ini) come along.")}</div>`);
      if (!$("#libcard")) $("#impcard").insertAdjacentHTML("afterend", `<div class="mt" id="libcard">${card("Model files", "folder", `<div class="body" id="library"><div class="skel" style="height:2.5rem"></div></div>`, `<button class="btn sm ghost" data-folder>${ic("folder")}Open folder</button>`, "", "What's in models/: space used and free, copies of the same file, files no model uses, and models whose Hugging Face repo has changed since you downloaded them.")}</div>`), libraryLoad();
      if (drawerFor?.startsWith("m:")){ const m = S.models.find(x => "m:" + x.name === drawerFor); if (m) modelDrawerFacts(m); }
    },
  },

  images: {

            <textarea id="iprompt" placeholder="Describe the picture: subject, setting, style, lighting. For example: a penguin reading a newspaper in a Viennese café, watercolour, soft morning light">${esc(store.get("img.prompt", ""))}</textarea></div>
          <details class="adv" id="iloras"${IMG.loras.length ? " open" : ""}><summary>LoRAs<span class="faint" id="iloracount">${IMG.loras.length ? ` · ${IMG.loras.length}` : ""}</span></summary><div id="ilorabody" style="margin-top:.625rem"></div></details>
          <div title="Negative prompt|What to keep out of the picture. Turbo and distilled models, run at guidance 1, ignore it."><div class="lab"><span>Leave out</span><span class="sub">optional</span></div><input id="ineg" placeholder="For example: blurry, text, watermark" value="${esc(store.get("img.neg", ""))}"></div>
          <div><div class="lab" title="Size|Most models are trained at about one megapixel (1024 × 1024). Larger sizes take much longer and more VRAM; upscaling a 1024 picture often looks better."><span>Size</span><span class="sub" id="imp"></span></div>
            <div class="isizes">${IMG_SIZES.map(([l, w, h]) => `<button data-isize="${w}x${h}"><b>${l}</b>${w}×${h}</button>`).join("")}</div>

// Model output is untrusted. It only ever becomes DOM nodes from a fixed set of tags, with its

function mdInline(parent, text){
  const re = /(`+)([\s\S]*?[^`])\1(?!`)|\*\*([\s\S]+?)\*\*|__([\s\S]+?)__|~~([\s\S]+?)~~|\*(?![*\s])((?:\*\*[\s\S]+?\*\*|[^*])+)\*|(?<![\w])_(?=\S)([\s\S]*?\S)_(?![\w])|\[([^\]\n]+)\]\(([^)\s]+)[^)]*\)/g;
  let at = 0, m;
  while ((m = re.exec(text))){
    if (m.index > at) parent.append(text.slice(at, m.index));
    let el;
    if (m[2] != null){ el = document.createElement("code"); el.textContent = m[2]; }
    else if (m[3] != null || m[4] != null){ el = document.createElement("strong"); mdInline(el, m[3] ?? m[4]); }
    else if (m[5] != null){ el = document.createElement("del"); mdInline(el, m[5]); }
    else if (m[6] != null || m[7] != null){ el = document.createElement("em"); mdInline(el, m[6] ?? m[7]); }
    else { el = document.createElement("span"); mdInline(el, m[8]); const u = document.createElement("span"); u.className = "url"; u.textContent = ` (${m[9]})`; el.append(u); }
    parent.append(el); at = re.lastIndex;
  }
  if (at < text.length) parent.append(text.slice(at));
}

function chime(){
  try{
    const a = new AudioContext(), t = a.currentTime;
    [[784, 0], [1046.5, .14]].forEach(([f, d]) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; o.type = "sine";

      o.connect(g).connect(a.destination); o.start(t + d); o.stop(t + d + .55); });
    setTimeout(() => a.close(), 1200);
  }catch{}
}

// Each file is read on this PC: documents by Erlaf's readers, text as it is, images as pictures.
async function addFiles(list){
  for (const f of list){
    let cls = DOCS.classifyFile(f);
    if (!cls && f.type.startsWith("image/")) cls = {kind: "image", max: 20e6};
    if (!cls && (TEXTISH.test(f.name) || f.type.startsWith("text/"))) cls = {kind: "text", ext: "txt", max: 4e6};
    if (!cls){ toast(`${f.name}: Waddle reads PDF, Word, Excel, PowerPoint, OpenDocument, Outlook and mail files, text and code, and images.`, true); continue; }
    if (f.size > cls.max){ toast(`${f.name} is ${gb(f.size / 2**30, 2)}; the limit for this kind of file is ${gb(cls.max / 2**30, 2)}.`, true); continue; }
    const entry = {name: f.name || "Pasted image", reading: true}; CH.files.push(entry); chipsDraw();
    try{
      const r = await DOCS.extractEntry({file: f, ...cls}, {});
      if (r.dataUrl) entry.url = r.dataUrl;
      else {
        const text = r.sheets ? r.sheets.map(x => x.text).join("\n\n") : r.text || "";
        const cut = DOCS.limitExtract(text);
        Object.assign(entry, {text: cut.text, format: r.format, truncated: cut.truncated});
        if (cut.truncated) toast(`${f.name} is long; only its first part is sent.`);
        // scanned PDF pages have no text, so they go along as pictures
        for (const pg of r.pageImages || []) CH.files.push({name: `${f.name}, page ${pg.page}`, url: pg.dataUrl});
      }
      entry.reading = false;
    }catch(e){ CH.files.splice(CH.files.indexOf(entry), 1); toast(`${f.name}: ${DOCS.errorText(e)}`, true); }
    chipsDraw();
  }
}

async function chatCompact(){

  const keep = 4, plain = c.messages.filter(x => !x.error);
  const older = plain.slice(0, Math.max(0, plain.length - keep)); if (older.length < 2) return toast("There's too little to summarise yet.", true);
  const before = older.flatMap(x => x.role === "summary" ? x.replaced : [x]);
  const transcript = older.map(x => x.role === "summary" ? `Earlier summary:\n${x.content}` : `${x.role === "user" ? "User" : "Assistant"}: ${(x.files || []).map(f => `[file ${f.name}]`).join(" ")} ${x.role === "user" ? x.content : splitThinking(x.content).answer}`).join("\n\n");
  const btn = $("[data-compact]"); btn?.classList.add("busy");
  try{
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({model: m.name, chat_template_kwargs: {enable_thinking: false}, temperature: 0.2,
      messages: [{role: "system", content: "Summarise this conversation so it can continue without the original. Keep facts, decisions, names, numbers, code that matters, and open questions. Write at most 300 words."}, {role: "user", content: transcript}]})});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "", out = "";
    for (;;){ const {value, done} = await reader.read(); if (done) break; buf += dec.decode(value, {stream: true});
      let k; while ((k = buf.indexOf("\n")) >= 0){ const line = buf.slice(0, k).trim(); buf = buf.slice(k + 1); if (!line.startsWith("data:") || line.includes("[DONE]")) continue; try{ out += JSON.parse(line.slice(5)).choices?.[0]?.delta?.content || ""; }catch{} } }
    out = splitThinking(out).answer.trim(); if (!out) throw new Error("The model returned no summary.");
    c.messages = [{role: "summary", content: out, replaced: before}, ...c.messages.slice(c.messages.indexOf(older[older.length - 1]) + 1)];
    chatDraw(true); ctxMeter(); await chatSave(); toast(`Summarised ${before.length} messages.`);
  }catch(e){ toast(e.message, true); }

}

// One request to llama.cpp through Waddle, streamed. Calls onChunk with each parsed event.
async function llm(path, body, app, onChunk, signal){
  const r = await fetch("/llm/" + path, {method: "POST", headers: {"Content-Type": "application/json", "X-Waddle-App": app}, body: JSON.stringify(body), signal});
  if (!r.ok){
    const d = await r.json().catch(() => ({})), raw = d.error?.message || d.error || `The server said ${r.status}.`;
    // llama.cpp's own words, turned into what happened and what to do
    throw new Error((await api("explain", {text: String(raw)}).catch(() => ({text: raw}))).text);
  }
  if (!body.stream) return r.json();
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;){
    const {value, done} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream: true});
    let k; while ((k = buf.indexOf("\n")) >= 0){
      const line = buf.slice(0, k).trim(); buf = buf.slice(k + 1);
      if (!line.startsWith("data:")) continue;
      const data = line.slice(5).trim(); if (data === "[DONE]") continue;
      try{ const j = JSON.parse(data); if (j.error) throw new Error(j.error.message || "The model stopped with an error."); onChunk(j); }catch(e){ if (e.message && !e.message.startsWith("Unexpected")) throw e; }
    }
  }
}

const TVREC = {ctx: null};
async function tvRecord(){
  const b = $("#tvrec");
  if (TVREC.ctx){
    clearInterval(TVREC.timer); TVREC.node.disconnect(); TVREC.stream.getTracks().forEach(t => t.stop()); const rate = TVREC.ctx.sampleRate; await TVREC.ctx.close(); TVREC.ctx = null;
    b.innerHTML = ic("mic") + "Record a voice"; b.classList.remove("d");
    const n = TVREC.chunks.reduce((a, c) => a + c.length, 0); if (n < rate) return toast("That was too short. Speak for 10 to 30 seconds.", true);
    const all = new Float32Array(n); let o = 0; for (const c of TVREC.chunks){ all.set(c, o); o += c.length; }
    return tvShow(wav(all, rate), "wav");
  }
  try{
    TVREC.stream = await navigator.mediaDevices.getUserMedia({audio: true}); TVREC.ctx = new AudioContext(); TVREC.chunks = [];
    const src = TVREC.ctx.createMediaStreamSource(TVREC.stream); TVREC.node = TVREC.ctx.createScriptProcessor(4096, 1, 1);
    TVREC.node.onaudioprocess = e => TVREC.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    src.connect(TVREC.node); TVREC.node.connect(TVREC.ctx.destination);
    const started = Date.now(); b.classList.add("d");
    const tick = () => { const s = Math.floor((Date.now() - started) / 1000); b.innerHTML = `${ic("stop")}Stop (${s} s)`; if (s >= 30) tvRecord(); };
    tick(); TVREC.timer = setInterval(tick, 500);
  }catch(e){ toast("The microphone isn't available: " + e.message, true); }
}

// The passages of an index closest to a question, best first
async function indexSearch(name, q, n = 5){
  const ix = await indexLoad(name), e = (await llm("v1/embeddings", {model: ix.model, input: [q]}, "search")).data[0].embedding;
  const cos = (a, b) => { let d = 0, x = 0, y = 0; for (let i = 0; i < a.length; i++){ d += a[i] * b[i]; x += a[i] * a[i]; y += b[i] * b[i]; } return d / Math.sqrt(x * y); };
  return ix.chunks.map(c => ({doc: c.doc, text: c.text, score: cos(e, c.vec)})).sort((a, b) => b.score - a.score).slice(0, n);
}
async function seAdd(files){
  const V = VIEWS.search, model = $("#semodel").value; if (!model) return toast("Get an embedding model under Find models › Embedding.", true);
  for (const f of files){
    if (f.size > 8e6){ toast(`${f.name} is over 8 MB.`, true); continue; }
    const text = await f.text(), parts = [];
    for (let i = 0; i < text.length; i += 700) parts.push(text.slice(Math.max(0, i - 100), i + 700).trim());
    put($("#sestat"), `Embedding ${f.name}…`);
    for (let i = 0; i < parts.length; i += 32){
      const batch = parts.slice(i, i + 32);
      try{
        const r = await llm("v1/embeddings", {model, input: batch}, "search");
        r.data.forEach((d, k) => V.chunks.push({doc: f.name, text: batch[k], vec: d.embedding}));
      }catch(e){ toast(e.message, true); return put($("#sestat"), ""); }
    }
    V.docs.push({name: f.name, parts: parts.length});
  }
  put($("#sestat"), `${V.chunks.length} passages from ${V.docs.length} file${V.docs.length === 1 ? "" : "s"}`);
  put($("#sedocs"), V.docs.map(d => `<div>${ic("file")} ${esc(d.name)} · ${d.parts} passages</div>`).join(""));
}
async function seRun(){
  const V = VIEWS.search, q = $("#seq").value.trim(), model = $("#semodel").value, rr = $("#sererank").value;
  if (!q || !V.chunks.length) return toast(V.chunks.length ? "Type a question." : "Add files first.", true);
  try{
    const e = (await llm("v1/embeddings", {model, input: [q]}, "search")).data[0].embedding;
    const cos = (a, b) => { let d = 0, x = 0, y = 0; for (let i = 0; i < a.length; i++){ d += a[i] * b[i]; x += a[i] * a[i]; y += b[i] * b[i]; } return d / Math.sqrt(x * y); };
    let hits = V.chunks.map(c => ({...c, score: cos(e, c.vec)})).sort((a, b) => b.score - a.score).slice(0, rr ? 20 : 8);
    if (rr){

      hits = r.results.map(x => ({...hits[x.index], rerank: x.relevance_score})).sort((a, b) => b.rerank - a.rerank).slice(0, 8);

    <div class="endpoint"><span class="tag">Key</span><code id="cnkey">${"•".repeat(24)}</code><button class="btn icon sm ghost" data-cnshow title="Show the key.">${ic("eye")}</button><button class="btn icon sm ghost" data-copy="${esc(I.key)}" title="Copy the key.">${ic("copy")}</button></div>
    <p class="sub" style="margin:.5rem 0 0">${S.settings.share ? "Apps on this computer and your network can use it, with the key." : "Only apps on this computer can reach it. To use it from a phone or another computer, turn on Settings › Network access."}</p>
