<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waddle</title>
<link rel="icon" href="{{ICON}}">
<style>
:root{
  color-scheme:light;
  --accent:#5b5bd6;
  --bg:#f5f5f7;--bg2:#fbfbfc;--panel:#ffffff;--sunk:#f1f1f4;--hover:#f0f0f4;--line:#e6e6eb;--line2:#d6d6de;
  --text:#111118;--dim:#55556a;--faint:#8a8a9c;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#6250d6;--track:#ececf1;
  --good:#16794a;--warn:#8a5a00;--bad:#c0262d;--good-bg:#e2f5ea;--warn-bg:#fcf1d8;--bad-bg:#fde6e6;
  --shadow-sm:0 1px 2px rgba(16,16,32,.06),0 1px 1px rgba(16,16,32,.03);
  --shadow:0 4px 16px rgba(16,16,32,.08),0 1px 3px rgba(16,16,32,.06);
  --shadow-lg:0 24px 64px rgba(16,16,32,.18),0 4px 12px rgba(16,16,32,.08);
  --mono:"Cascadia Code","Cascadia Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r:10px;--r2:14px;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0c0c10;--bg2:#101015;--panel:#15151b;--sunk:#1b1b22;--hover:#1f1f27;--line:#25252e;--line2:#33333e;
  --text:#ededf2;--dim:#b4b4c4;--faint:#7d7d90;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;--track:#23232c;
  --good:#5fd09a;--warn:#f0bd55;--bad:#ff8a8a;--good-bg:#12291e;--warn-bg:#2e2510;--bad-bg:#341719;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 6px 20px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 30px 80px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0c10;--bg2:#101015;--panel:#15151b;--sunk:#1b1b22;--hover:#1f1f27;--line:#25252e;--line2:#33333e;
  --text:#ededf2;--dim:#b4b4c4;--faint:#7d7d90;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;--track:#23232c;
  --good:#5fd09a;--warn:#f0bd55;--bad:#ff8a8a;--good-bg:#12291e;--warn-bg:#2e2510;--bad-bg:#341719;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 6px 20px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 30px 80px rgba(0,0,0,.6);
}
:root{--accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);--accent-line:color-mix(in srgb,var(--accent) 35%,transparent);--accent-text:color-mix(in srgb,var(--accent) 80%,var(--text))}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;display:flex;overflow:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text);text-decoration:none}a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:12.5px}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background-color:var(--faint)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.lg{width:18px;height:18px}

/* ---------- sidebar ---------- */
#nav{width:244px;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px 12px;transition:width .25s var(--ease);position:relative;z-index:3}
body.mini #nav{width:56px;padding:12px 8px 10px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 18px;white-space:nowrap;overflow:hidden}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px var(--accent-line)}
.brand .logo img{width:24px;height:24px;image-rendering:pixelated}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}.brand small{display:block;color:var(--faint);font-size:11.5px}
.group{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px;white-space:nowrap;overflow:hidden;transition:opacity .2s}
body.mini .group{opacity:0;height:12px;padding:0}
#tabs{position:relative;display:flex;flex-direction:column;gap:2px}
#ind{position:absolute;left:0;right:0;height:34px;border-radius:9px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line);transition:transform .32s var(--ease),opacity .2s;pointer-events:none;z-index:0}
#ind::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.tab{all:unset;position:relative;z-index:1;display:flex;align-items:center;gap:11px;height:34px;padding:0 10px;border-radius:9px;cursor:pointer;color:var(--dim);font-weight:500;white-space:nowrap;transition:color .15s,background .15s}
.tab:hover{color:var(--text);background:var(--hover)}
.tab.on{color:var(--accent-text);background:transparent}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tab .lbl{flex:1;overflow:hidden;transition:opacity .2s}
body.mini .tab .lbl,body.mini .tab .count{opacity:0;width:0}
.count{font-size:11px;font-weight:600;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--sunk);color:var(--dim);display:grid;place-items:center}
.tab.on .count{background:var(--accent);color:#fff}
.navfoot{margin-top:auto;display:grid;gap:8px}
.svc{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;display:grid;gap:3px;font-size:12px;box-shadow:var(--shadow-sm);white-space:nowrap;overflow:hidden;transition:opacity .2s}
.svc b{display:flex;align-items:center;gap:7px;font-size:12.5px}
.svc span{color:var(--faint)}
body.mini .svc{padding:9px 0;justify-items:center;border-radius:10px}body.mini .svc>span,body.mini .svc .t{display:none}body.mini .svc b{gap:0}body.mini .brand{padding:2px 1px 14px}body.mini .brand>div:not(.logo),body.mini .collapse span{display:none}body.mini .collapse{justify-content:center;padding:7px 0}body.mini .tab{padding:0 11px}
.collapse{all:unset;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--faint);cursor:pointer;font-size:12.5px;white-space:nowrap}
.collapse:hover{background:var(--hover);color:var(--text)}
body.mini .collapse svg{transform:rotate(180deg)}

/* ---------- top bar ---------- */
#shell{flex:1;min-width:0;display:flex;flex-direction:column}
#top{height:60px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);position:relative;z-index:2}
#top .ttl{min-width:0}
#top h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.015em}
#top .crumb{font-size:12px;color:var(--faint)}
.search{all:unset;display:flex;align-items:center;gap:9px;height:34px;padding:0 10px 0 12px;width:300px;max-width:32vw;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--faint);cursor:pointer;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s;margin-left:auto}
.search:hover{border-color:var(--line2)}
.search span{flex:1}
kbd{font:600 10.5px var(--mono);padding:2px 6px;border-radius:5px;border:1px solid var(--line2);border-bottom-width:2px;color:var(--dim);background:var(--sunk)}
#page{flex:1;min-height:0;overflow:auto;padding:22px 24px 48px;scroll-behavior:smooth}
.view{animation:enter .32s var(--ease) both;max-width:1600px;margin:0 auto}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- parts ---------- */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.mt{margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow-sm);min-width:0;transition:box-shadow .2s,border-color .2s}
.card>header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);min-height:52px}
.card>header h2{font-size:13px;margin:0;font-weight:620;flex:1;display:flex;align-items:center;gap:9px;letter-spacing:-.005em}
.card>header h2 .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--sunk);color:var(--dim)}
.card>header .meta{color:var(--faint);font-size:12px}
.card .body{padding:14px 16px}
.tile{padding:14px 16px 13px;position:relative;overflow:hidden}
.tile .k{color:var(--dim);font-size:12px;font-weight:500;display:flex;align-items:center;gap:7px}
.tile .k .ic{color:var(--faint)}
.tile .v{font-size:24px;font-weight:650;margin-top:4px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:13px;color:var(--faint);font-weight:500;letter-spacing:0}
.tile .s{color:var(--faint);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:5px;border-radius:3px;background:var(--track);margin-top:11px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .6s var(--ease)}
.spark{position:absolute;right:12px;top:12px;width:84px;height:28px;opacity:.9}

.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 13px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;background:var(--panel);font-weight:560;font-size:12.5px;white-space:nowrap;color:var(--text);box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,box-shadow .15s,transform .08s,filter .15s;user-select:none}
.btn:hover{background:var(--hover);border-color:var(--faint)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.p{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));border-color:color-mix(in srgb,var(--accent) 70%,#000);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.p:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--dim)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.d{color:var(--bad)}
.btn.d.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn.icon{width:32px;padding:0}.btn.icon.sm{width:28px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.busy{pointer-events:none;color:transparent!important;position:relative}
.btn.busy::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-color:var(--faint) transparent var(--faint) var(--faint);animation:spin .7s linear infinite}
.btn.p.busy::after{border-color:#fff transparent #fff #fff}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.sub{color:var(--faint);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line2);color:var(--dim);white-space:nowrap;background:var(--panel)}
.badge.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:550;background:var(--sunk);color:var(--dim);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.good{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 20%,transparent)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.dot.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
input[type=text],input[type=number],input:not([type]),select,textarea{height:34px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:0 11px;outline:none;min-width:0;transition:border-color .15s,box-shadow .15s}
select{padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:grid;gap:5px}.field>span{font-size:12px;font-weight:550;color:var(--dim)}
.switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;color:var(--dim);white-space:nowrap}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch i{width:34px;height:20px;border-radius:99px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s var(--ease)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(14px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--dim);white-space:nowrap}
.check input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:9px;background:var(--sunk);border:1px solid var(--line)}
.seg button{all:unset;position:relative;z-index:1;height:26px;padding:0 13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--dim);font-weight:560;font-size:12.5px;border-radius:6px;transition:color .2s}
.seg button.on{color:var(--text)}
.seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--panel);box-shadow:var(--shadow-sm),0 0 0 1px var(--line);transition:left .28s var(--ease),width .28s var(--ease)}
.empty{color:var(--faint);padding:32px 16px;text-align:center;display:grid;justify-items:center;gap:8px}
.empty svg{width:28px;height:28px;stroke-width:1.5;opacity:.6}
.skel{border-radius:6px;background:linear-gradient(90deg,var(--sunk) 0%,var(--hover) 50%,var(--sunk) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;height:12px}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- tables ---------- */
.tw{overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0}
th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0;z-index:1}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;transition:background .12s}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--hover)}
tbody tr.sel td{background:var(--accent-soft)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.name{font-weight:600;overflow-wrap:anywhere}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}

/* ---------- charts ---------- */
.chart{position:relative;height:170px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;z-index:2;transition:left .08s linear}
.chart .tip b{font-weight:650}
.legend{display:flex;gap:14px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--track)}
.stack i{display:block;height:100%;transition:width .6s var(--ease)}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--dim)}
.keys span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c);vertical-align:0}
.slot{display:grid;grid-template-columns:56px 1fr 170px;gap:12px;align-items:center;padding:6px 0;font-size:12.5px}
.slot .bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden;display:flex;gap:2px}
.slot .bar i{display:block;height:100%;transition:width .6s var(--ease)}

/* ---------- layouts ---------- */
.hub{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.facets{position:sticky;top:0;display:grid;gap:14px;padding:16px}
.facets h3{margin:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.facets .range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facets .opts{display:grid;gap:9px}
pre.log{margin:0;padding:14px 16px;font:12px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;height:calc(100vh - 220px);overflow:auto}
pre.log .e{color:var(--bad)}pre.log .w{color:var(--warn)}
pre.cardtext{margin:0;font:12px/1.6 var(--mono);white-space:pre-wrap;color:var(--dim)}
.kv{display:grid;grid-template-columns:minmax(120px,170px) 1fr 32px;gap:8px;align-items:center}
.kv input{width:100%}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;margin:0;font-size:12.5px}
dl.facts dt{color:var(--faint)}dl.facts dd{margin:0;overflow-wrap:anywhere}
.endpoint{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);margin-bottom:8px}
.endpoint code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.events{max-height:300px;overflow:auto}
.ev{display:flex;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:baseline}
.ev:last-child{border-bottom:0}
.ev time{color:var(--faint);flex:none;width:58px;font-size:11.5px}
.ev .dot{transform:translateY(-1px)}
.setting{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}.setting:first-child{padding-top:2px}
.setting b{font-weight:600;font-size:13px}
.hero{padding:28px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;background:radial-gradient(120% 140% at 0% 0%,var(--accent-soft),transparent 60%),var(--panel)}
.hero h2{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}
.step{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);display:grid;gap:6px}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent-text)}
.step.done .n{background:var(--good-bg);color:var(--good)}
.swatches{display:flex;gap:10px}
.sw{all:unset;width:26px;height:26px;border-radius:50%;cursor:pointer;background:var(--c);box-shadow:0 0 0 2px var(--panel),0 0 0 3px transparent;transition:box-shadow .2s,transform .15s}
.sw:hover{transform:scale(1.1)}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}
.prog{height:6px;border-radius:3px;background:var(--track);overflow:hidden;position:relative}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s var(--ease)}

.pic .acts .btn{width:30px;height:30px;background:color-mix(in srgb,var(--panel) 88%,transparent);border-color:var(--line2);color:var(--text);backdrop-filter:blur(6px)}
.drawer-sec{margin-top:18px}.drawer-sec:first-child{margin-top:0}.drawer-sec>h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;display:flex;align-items:center;gap:6px}
#drawer .tabsbar button{all:unset;padding:11px 10px;cursor:pointer;color:var(--dim);font-weight:560;font-size:12.5px;border-bottom:2px solid transparent;transition:color .15s,border-color .2s}

#modal{position:fixed;inset:0;display:grid;place-items:center;z-index:30;pointer-events:none}
#modal .box{width:min(560px,94vw);max-height:84vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);opacity:0;transform:scale(.96) translateY(8px);transition:opacity .2s,transform .25s var(--ease)}

.diff .da{color:var(--good);background:var(--good-bg);display:inline-block;width:100%}.diff .dd{color:var(--bad);background:var(--bad-bg);display:inline-block;width:100%}.diff .dh{color:var(--faint)}

.fitcell.full{background:var(--good-bg)}.fitcell.partial{background:var(--warn-bg)}.fitcell.big{opacity:.45}
.implist{max-height:360px;overflow:auto;display:grid;gap:2px}.implist label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer}.implist label:hover{background:var(--hover)}
.implist .src{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 8px 2px}
#menu{display:none}
@media (max-width:700px){
  body{flex-direction:column}
  #nav{position:fixed;inset:0 auto 0 0;width:260px!important;transform:translateX(-100%);transition:transform .25s var(--ease);z-index:30;box-shadow:var(--shadow-lg)}
  body.navopen #nav{transform:none}
  body.navopen #scrim{opacity:1;pointer-events:auto}
  body #nav .tab .lbl,body #nav .group,body #nav .svc,body #nav .brand div,body #nav .count{display:revert!important;opacity:1!important;width:auto!important;height:auto!important}
  #collapse{display:none}#menu{display:inline-flex}
  #top{padding:10px 12px;gap:8px}#top .search{display:none}
  #page{padding:14px 12px 40px}
  .g2,.g3,.g4,.grid.g2{grid-template-columns:1fr!important}
  .chat{grid-template-columns:1fr}.clist{display:none}.cbar{padding:8px 10px}.cbar select{max-width:150px}
  .composer{padding:6px 8px 10px}.cfoot .hint{display:none}
  .hub{grid-template-columns:1fr}.facets{position:static}
  #drawer{width:100%!important}
  .tw{overflow-x:auto}
}
/* ---------- image studio ---------- */
#iprompt{width:100%;height:auto;min-height:92px;padding:10px 12px;resize:vertical;line-height:1.5}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:16px}
.pic{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.pic img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in;background:var(--sunk)}
.pic figcaption{padding:8px 6px 8px 10px;font-size:12px;color:var(--dim);display:flex;gap:2px;align-items:flex-start}
.pic .p{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.9em}
.pic .btn{width:26px;height:26px;padding:0;border-color:transparent;box-shadow:none;background:transparent;color:var(--faint)}.pic .btn:hover{color:var(--text)}
.bigpic{display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:10px}
.rec dl{margin:10px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>', plus:'<path d="M12 5v14M5 12h14"/>', power:'<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>', palette:'<circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20c1 0 1.5-.8 1.5-1.6 0-.5-.2-.8-.5-1.2-.3-.4-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6H16a6 6 0 0 0 6-6c0-4.9-4.5-8.4-10-8.4Z"/>',

/* ================= theme and accent ================= */
const ACCENTS = {Indigo:"#5b5bd6", Blue:"#2f6fe4", Teal:"#0f9488", Violet:"#8b5cf6", Rose:"#e11d63", Amber:"#d97706", Graphite:"#52525b"};
function applyLook(){
  const t = store.get("theme", ""); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  document.documentElement.style.setProperty("--accent", store.get("accent", ACCENTS.Indigo));
  $("#theme").innerHTML = ic(isDark() ? "sun" : "moon");
  if (store.get("mini", false)) document.body.classList.add("mini");
}
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
applyLook();
$("#theme").onclick = () => { store.set("theme", isDark() ? "light" : "dark"); applyLook(); drawCharts(); };
$("#collapse").onclick = () => { document.body.classList.toggle("mini"); store.set("mini", document.body.classList.contains("mini")); setTimeout(moveInd, 260); setTimeout(drawCharts, 280); };

/* ================= talking to Waddle ================= */
async function api(name, body={}){
  const r = await fetch("/api/"+name, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}
function toast(text, bad=false){
  const t = document.createElement("div"), life = bad ? 6500 : 3200;
  t.className = "toast" + (bad ? " bad" : ""); t.style.setProperty("--life", life+"ms");
  t.innerHTML = `<div class="ti">${ic(bad ? "alert" : "check")}</div><div class="grow">${esc(text)}</div>`;
  $("#toasts").prepend(t);
  const gone = () => { t.classList.add("out"); setTimeout(() => t.remove(), 260); };
  t.onclick = gone; setTimeout(gone, life);
}
async function act(name, body={}, btn){
  btn?.classList.add("busy");
  try{ const d = await api(name, body); if (d.message) toast(d.message); refresh(); return d; }
  catch(e){ toast(e.message, true); }
  finally{ btn?.classList.remove("busy"); }
}
function modal(title, html, buttons=""){
  const m = $("#modal");
  $(".box", m).innerHTML = `<header><h2>${esc(title)}</h2><button class="btn icon sm ghost" data-close>${ic("x")}</button></header><div class="mbody">${html}</div>${buttons ? `<footer>${buttons}</footer>` : ""}`;
  m.classList.add("on"); $("#scrim").classList.add("on");
}
function closeAll(){ $("#modal").classList.remove("on"); $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); $("#palette").classList.remove("on"); drawerFor = null; }
$("#scrim").onclick = () => { closeAll(); document.body.classList.remove("navopen"); };
$("#menu").onclick = () => document.body.classList.toggle("navopen");

/* ================= state ================= */
const PAGES = [
  ["Try", [["chat","Chat"],["arena","Arena"],["playground","Playground"],["images","Images"],["speech","Speech"],["search","Search"]]],
  ["Run", [["overview","Overview"],["models","Models"],["inspector","Inspector"],["connect","Connect"]]],
  ["Get", [["hub","Hugging Face"],["downloads","Downloads"]]],
  ["System", [["logs","Logs"],["settings","Settings"]]],
];
const NAMES = Object.fromEntries(PAGES.flatMap(([g, ps]) => ps.map(([id, l]) => [id, [l, g]])));
NAMES.setup = ["Welcome", "Waddle"];
const deep = location.hash.match(/^#hub\/(.+)$/);   // #hub/owner/repo opens that model
const deepModel = location.hash.match(/^#model\/(.+)$/);   // #model/name opens a model's panel
let page = deep ? "hub" : deepModel ? "models" : NAMES[location.hash.slice(1)] ? location.hash.slice(1) : NAMES[store.get("page", "")] ? store.get("page", "") : "overview";
let S = null, L = [], meta = {}, built = "", drawerFor = null;

async function refresh(){
  try{ S = await api("state"); }
  catch(e){ put($("#status"), `<span class="badge bad"><span class="dot bad"></span>Not connected</span>`); return; }
  // the first time, and whenever there's nothing to run yet, start with setup
  if (!refresh.once){ refresh.once = true; if (!store.get("setup.done", false) && (!S.server || !S.models.length) && page !== "setup") return go("setup"); }
  frame(); draw();
  if (S.problem) toast(S.problem, true);
}
async function pollLive(){
  try{
    const r = await api("live", {since: L.length ? L[L.length-1].t : 0});
    meta = r; L = L.concat(r.samples).slice(-300);
    if (S && L.length) VIEWS[page].live?.();
  }catch{}
  setTimeout(pollLive, 1000);
}
setInterval(refresh, 2500);
const loadedModel = () => S?.models.find(m => ["loaded","loading","sleeping"].includes(m.status));
const last = () => L[L.length-1];

/* ================= frame ================= */
function buildNav(){
  $("#tabs").innerHTML = `<div id="ind"></div>` + PAGES.map(([g, ps]) => `<div class="group">${g}</div>` + ps.map(([id, l]) =>
    `<button class="tab${id===page?" on":""}" data-page="${id}" title="${l}">${ic(id)}<span class="lbl">${l}</span><span class="count" id="n-${id}" hidden></span></button>`).join("")).join("");
  moveInd();
}
function moveInd(){
  const on = $(`.tab[data-page="${page}"]`), ind = $("#ind"); if (!on || !ind) return;
  ind.style.transform = `translateY(${on.offsetTop}px)`;
}
function frame(){
  const active = S.downloads.filter(d => d.state !== "done").length;
  for (const [id, n] of [["models", S.models.length], ["downloads", active]]){ const el = $(`#n-${id}`); if (el){ el.hidden = !n; el.textContent = n; } }

const COMMON = ["ctx-size","n-gpu-layers","n-cpu-moe","cache-type-k","cache-type-v","flash-attn","parallel","threads","batch-size","ubatch-size","temp","top-p","top-k","min-p","presence-penalty","repeat-penalty","reasoning-budget","mmproj","model-draft","spec-type","spec-draft-n-max","jinja","hf-page","diffusion-model","vae","llm","clip_l","t5xxl","listen-port","steps","cfg-scale","sampling-method"];
function kvEditor(el, section, values){
  const row = (k, v) => `<input value="${esc(k)}" data-k list="keys" placeholder="setting"><input value="${esc(v)}" data-v placeholder="value"><button type="button" class="btn icon sm ghost" data-rm title="Remove">${ic("x")}</button>`;
  el.innerHTML = `<div class="kv" data-section="${esc(section)}">${Object.entries(values).map(([k, v]) => row(k, v)).join("")}${row("", "")}</div>
    <datalist id="keys">${COMMON.map(k => `<option value="${k}">`).join("")}</datalist>
    <div class="row" style="margin-top:12px"><button class="btn sm" data-addkv>${ic("plus")}Add</button><div class="grow"></div><span class="sub">${section === "image" ? "stable-diffusion.cpp" : "llama.cpp"} options, without the dashes</span><button class="btn p sm" data-savekv>Save</button></div>`;
  el._orig = Object.keys(values);
}
function readKV(el){
  const out = {}, k = $$("[data-k]", el), v = $$("[data-v]", el);
  k.forEach((x, i) => { if (x.value.trim() && !x.dataset.gone) out[x.value.trim()] = v[i].value; });
  for (const key of el._orig) if (!(key in out)) out[key] = "";
  return {section: $(".kv", el).dataset.section, values: out};
}

        const p = d.total ? d.done / d.total * 100 : 0, left = d.speed ? (d.total - d.done) / d.speed : 0, run = d.state === "downloading";

// Model output is untrusted. It only ever becomes DOM nodes from a fixed set of tags, with its
// text set through text nodes, so nothing a model writes can become markup or a script.
// Links are shown as text: clicking one would take Waddle's own window away.
function mdInline(parent, text){
  const re = /(`+)([\s\S]*?[^`])\1(?!`)|\*\*([\s\S]+?)\*\*|__([\s\S]+?)__|~~([\s\S]+?)~~|\*(?![*\s])((?:\*\*[\s\S]+?\*\*|[^*])+)\*|(?<![\w])_(?=\S)([\s\S]*?\S)_(?![\w])|\[([^\]\n]+)\]\(([^)\s]+)[^)]*\)/g;
  let at = 0, m;
  while ((m = re.exec(text))){
    if (m.index > at) parent.append(text.slice(at, m.index));
    let el;
    if (m[2] != null){ el = document.createElement("code"); el.textContent = m[2]; }
    else if (m[3] != null || m[4] != null){ el = document.createElement("strong"); mdInline(el, m[3] ?? m[4]); }
    else if (m[5] != null){ el = document.createElement("del"); mdInline(el, m[5]); }
    else if (m[6] != null || m[7] != null){ el = document.createElement("em"); mdInline(el, m[6] ?? m[7]); }
    else { el = document.createElement("span"); mdInline(el, m[8]); const u = document.createElement("span"); u.className = "url"; u.textContent = ` (${m[9]})`; el.append(u); }
    parent.append(el); at = re.lastIndex;
  }
  if (at < text.length) parent.append(text.slice(at));
}
function mdCode(code, lang){

  const head = document.createElement("header"), name = document.createElement("span"), copy = document.createElement("button"), pre = document.createElement("pre"), c = document.createElement("code");
  name.textContent = lang || "text"; copy.className = "btn ghost"; copy.dataset.copycode = ""; copy.innerHTML = ic("copy") + "Copy";
  c.textContent = code; pre.append(c); head.append(name, copy); box.append(head, pre);
  return box;
}
const indentOf = l => l.match(/^\s*/)[0].replace(/\t/g, "    ").length;
const ITEM = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
function md(root, src){

  const starts = l => /^\s*(```|~~~)/.test(l) || /^#{1,6}\s/.test(l) || /^\s*>/.test(l) || ITEM.test(l) || /^\s*([-*_])(\s*\1){2,}\s*$/.test(l);

      i++; root.append(mdCode(code.join("\n"), m[2])); continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))){ const h = el("h" + Math.min(6, m[1].length + 2)); mdInline(h, m[2]); root.append(h); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){ root.append(el("hr")); i++; continue; }
    if (/^\s*>/.test(line)){
      const q = []; while (i < n && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ""));
      const b = el("blockquote"); md(b, q.join("\n")); root.append(b); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < n && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1])){
      const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const wrap = el("div"), table = el("table"), head = el("tr"); wrap.className = "tbl";
      for (const c of cells(line)){ const th = el("th"); mdInline(th, c); head.append(th); }
      const thead = el("thead"), tbody = el("tbody"); thead.append(head); i += 2;
      while (i < n && /^\s*\|.*\|\s*$/.test(lines[i])){ const tr = el("tr"); for (const c of cells(lines[i++])){ const td = el("td"); mdInline(td, c); tr.append(td); } tbody.append(tr); }

function chime(){

    [[784, 0], [1046.5, .14]].forEach(([f, d]) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; o.type = "sine";

  return `<ul class="todos">${todos.map(t => `<li class="${esc(t.status)}">${ic(t.status === "completed" ? "check" : t.status === "in_progress" ? "play" : "x")}<span>${esc(t.content)}</span></li>`).join("")}</ul>`;
}
function eventNode(e){
  const el = document.createElement("div"); el.className = `ev-${e.kind}`; el.dataset.n = e.n;
  fillEvent(el, e); return el;
}
function fillEvent(el, e){
  const ms = v => v == null ? "" : v < 1000 ? `${v} ms` : v < 60000 ? `${(v / 1000).toFixed(1)} s` : `${Math.floor(v / 60000)} min ${Math.round(v % 60000 / 1000)} s`;
  switch (e.kind){
    case "user": el.className = "msg user"; el.innerHTML = `<div class="bubble"></div>`; $(".bubble", el).textContent = e.text + (e.images ? `\n[${e.images} image${e.images > 1 ? "s" : ""}]` : ""); break;
    case "request":
      el.className = "tl-meta";
      el.innerHTML = e.status === "running" ? `<span class="spin"></span>Asking ${esc(e.model)}…`
        : `${ic("bolt")}<span${tipAttr("Model request|One round trip to the model: the tokens it read (its whole context so far), the tokens it wrote, writing speed, and time.")}>${esc(e.model)} · ${big(e.prompt || 0)} in${e.context ? ` (${Math.round((e.prompt || 0) / e.context * 100)}% of context)` : ""} · ${big(e.output || 0)} out${e.tps ? ` · ${(+e.tps).toFixed(1)} t/s` : ""} · ${ms(e.ms)}${e.status === "stopped" ? " · stopped" : e.status === "failed" ? " · failed" : ""}</span>`;
      break;
    case "thinking": {
      const open = $("details", el)?.open ?? false;
      el.className = "tl-think";
      el.innerHTML = `<details class="think"${open ? " open" : ""}><summary>${ic("brain")}<span>${e.seconds != null ? `Thought for ${e.seconds} s` : "Thinking…"}</span></summary><div class="md"></div></details>`;
      md($(".md", el), e.text || ""); break;
    }
    case "text": el.className = "msg assistant"; el.innerHTML = `<div class="body md"></div>`; md($(".body", el), e.text || ""); if (!e.done && CH.cur?.running) $(".body", el).lastElementChild?.classList.add("cursor"); break;
    case "tool": {
      const open = $("details", el)?.open ?? (e.status === "waiting" || e.tool === "task" || e.tool === "todo");
      el.className = `tl-tool ${e.status || ""}`;
      const d = e.detail || {}, a = e.args || {};
      let body = "";
      if (e.tool === "todo") body = todoHTML(a.todos);
      else if (d.diff) body = diffHTML(d.diff);
      else if (e.tool === "bash") body = `<pre class="cmd">${esc(a.command)}</pre>`;
      else if (e.tool !== "task" && Object.keys(a).length) body = `<pre class="args">${esc(JSON.stringify(a, null, 2))}</pre>`;
      if (e.tool === "task") body = `<div class="prompt sub">${esc(a.prompt)}</div><div class="tl-children" data-group="${e.n}"></div>`;
      if (e.result != null && e.tool !== "todo") body += `<div class="tl-label">${e.tool === "task" ? "Report" : "Result"}</div>${e.tool === "task" ? `<div class="md report"></div>` : `<pre class="out">${esc(e.result)}</pre>`}`;
      if (e.status === "waiting") body += `<div class="approve"><span class="grow">${e.tool === "bash" ? "Run this command?" : e.tool === "write" || e.tool === "edit" ? "Make this change?" : "Allow this?"}</span>
        <button class="btn sm" data-adeny="${e.n}">Decline</button><button class="btn sm" data-aalways="${e.n}" title="Allow for the rest of this session|Calls to ${esc(e.tool)} won't ask again in this session.">Always allow</button><button class="btn p sm" data-aallow="${e.n}">${ic("check")}Allow</button></div>`;
      const kids = $(".tl-children", el); // keep a subagent's events when redrawing
      el.innerHTML = `<details${open ? " open" : ""}><summary>${ic(TOOL_ICON[e.tool] || "ext")}<span class="grow">${toolTitle(e)}</span>${STATUS_CHIP[e.status] || ""}<span class="faint">${ms(e.ms)}</span></summary><div class="tl-body">${body}</div></details>`;
      if (kids){ const slot = $(".tl-children", el); if (slot) slot.replaceWith(kids); }
      if (e.tool === "task" && e.result != null) md($(".report", el), e.result);
      break;
    }
    case "compaction": el.className = "tl-note"; el.innerHTML = `${ic("layers")}<span>${esc(e.text)}</span>${e.summary ? `<details><summary>Summary</summary><div class="md"></div></details>` : ""}`; if (e.summary) md($(".md", el), e.summary); break;
    case "note": el.className = "tl-note"; el.innerHTML = `${ic("info")}<span>${esc(e.text)}</span>`; break;
    case "error": el.className = "msg err"; el.innerHTML = `<div class="bubble"></div>`; $(".bubble", el).textContent = e.text; break;
    case "end": el.className = "tl-end"; el.innerHTML = `${ic(e.stopped ? "stop" : "check")}<span>${e.stopped ? "Stopped" : "Finished"} after ${ms(e.ms)} · ${e.tools} tool call${e.tools === 1 ? "" : "s"}</span>`; break;
  }
}

function timelineUpdate(changed){
  const box = $("#mlist"); if (!box || !agentMode()) return;
  if (!$(".tl-meta,.tl-tool,.msg,.tl-note,.tl-think,.tl-end", box)) return timelineDraw();

    const el = $(`[data-n="${e.n}"]`, box);
    if (el) fillEvent(el, e); else (parentOf(e) || box).append(eventNode(e));
  }
  ctxMeter();
  if (stick) toEnd();

// Like Erlaf: a visible step taken by the person. The originals stay in the chat, and Undo restores them.
async function chatCompact(){
  const c = CH.cur, m = chatModel(); if (!c || !m || CH.run) return;
  const keep = 4, plain = c.messages.filter(x => !x.error);
  const older = plain.slice(0, Math.max(0, plain.length - keep)); if (older.length < 2) return toast("There's too little to summarise yet.", true);
  const before = older.flatMap(x => x.role === "summary" ? x.replaced : [x]);
  const transcript = older.map(x => x.role === "summary" ? `Earlier summary:\n${x.content}` : `${x.role === "user" ? "User" : "Assistant"}: ${(x.files || []).map(f => `[file ${f.name}]`).join(" ")} ${x.role === "user" ? x.content : splitThinking(x.content).answer}`).join("\n\n");
  const btn = $("[data-compact]"); btn?.classList.add("busy");
  try{
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({model: m.name, chat_template_kwargs: {enable_thinking: false}, temperature: 0.2,
      messages: [{role: "system", content: "Summarise this conversation so it can continue without the original. Keep facts, decisions, names, numbers, code that matters, and open questions. Write at most 300 words."}, {role: "user", content: transcript}]})});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "", out = "";
    for (;;){ const {value, done} = await reader.read(); if (done) break; buf += dec.decode(value, {stream: true});
      let k; while ((k = buf.indexOf("\n")) >= 0){ const line = buf.slice(0, k).trim(); buf = buf.slice(k + 1); if (!line.startsWith("data:") || line.includes("[DONE]")) continue; try{ out += JSON.parse(line.slice(5)).choices?.[0]?.delta?.content || ""; }catch{} } }
    out = splitThinking(out).answer.trim(); if (!out) throw new Error("The model returned no summary.");
    c.messages = [{role: "summary", content: out, replaced: before}, ...c.messages.slice(c.messages.indexOf(older[older.length - 1]) + 1)];
    chatDraw(true); ctxMeter(); await chatSave(); toast(`Summarised ${before.length} messages.`);
  }catch(e){ toast(e.message, true); }
  btn?.classList.remove("busy");
}

const textModels = () => (S?.models || []).filter(m => !m.missing.length && (m.kind || "text") === "text");
// One request to llama.cpp through Waddle, streamed. Calls onChunk with each parsed event.
async function llm(path, body, app, onChunk, signal){
  const r = await fetch("/llm/" + path, {method: "POST", headers: {"Content-Type": "application/json", "X-Waddle-App": app}, body: JSON.stringify(body), signal});
  if (!r.ok){ const d = await r.json().catch(() => ({})); throw new Error(d.error?.message || d.error || `HTTP ${r.status}`); }
  if (!body.stream) return r.json();
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;){
    const {value, done} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream: true});
    let k; while ((k = buf.indexOf("\n")) >= 0){
      const line = buf.slice(0, k).trim(); buf = buf.slice(k + 1);
      if (!line.startsWith("data:")) continue;
      const data = line.slice(5).trim(); if (data === "[DONE]") continue;
      try{ const j = JSON.parse(data); if (j.error) throw new Error(j.error.message || "The model stopped with an error."); onChunk(j); }catch(e){ if (e.message && !e.message.startsWith("Unexpected")) throw e; }
    }
  }
}
const pct2 = v => `${Math.round(v * 100)}%`;
const probColor = p => `hsl(${Math.round(p * 120)} 70% 45% / .22)`;

const baseName = m => (m.file || m.name).replace(/\.gguf$/i, "").replace(/[-_.]?(UD[-_])?(I?Q\d\w*|BF16|F16|MXFP4)\b.*$/i, "").toLowerCase();
// installed models that are the same model at different quantizations
function quantPairs(){
  const groups = {}; for (const m of textModels()) if (!m.preset_of) (groups[baseName(m)] ||= []).push(m);
  return Object.values(groups).filter(g => g.length > 1).map(g => g.sort((a, b) => a.size - b.size)).map(g => [g[0], g[g.length - 1]]);
}

async function arenaRun(){
  const V = VIEWS.arena, prompt = $("#aprompt").value.trim(), sys = $("#asys").value.trim();

function pgSettings(){
  const p = store.get("pg", {}), v = id => $("#" + id);
  $$("[data-pg]").forEach(i => p[i.dataset.pg] = +i.value);
  Object.assign(p, {adv: v("pgadv")?.open, model: v("pgmodel")?.value, seed: v("pgseed")?.value, format: v("pgformat")?.value, schema: v("pgschema")?.value, probs: v("pgprobs")?.checked, sys: v("pgsys")?.value, prompt: v("pgprompt")?.value});
  store.set("pg", p); return p;
}
function pgRequest(){
  const p = pgSettings(), raw = p.mode === "raw";
  const body = {model: p.model, stream: true, temperature: p.temperature ?? .7, top_p: p.top_p ?? .95, top_k: p.top_k ?? 40, min_p: p.min_p ?? .05, repeat_penalty: p.repeat_penalty ?? 1};
  if (p.seed !== "" && p.seed != null) body.seed = +p.seed;
  if (p.format === "json") body.response_format = {type: "json_object"};
  if (p.format === "schema"){ try{ body.response_format = {type: "json_schema", json_schema: {schema: JSON.parse(p.schema || "{}")}}; }catch{ throw new Error("The JSON schema isn't valid JSON."); } }
  if (p.format === "grammar") body.grammar = p.schema || "";
  if (raw){ Object.assign(body, {prompt: p.prompt || "", n_predict: p.max_tokens ?? 512}); if (p.probs) body.n_probs = 5; }
  else { Object.assign(body, {max_tokens: p.max_tokens ?? 512, stream_options: {include_usage: true}, messages: [...(p.sys ? [{role: "system", content: p.sys}] : []), {role: "user", content: p.prompt || ""}]}); if (p.probs){ body.logprobs = true; body.top_logprobs = 5; } }
  return {path: raw ? "completion" : "v1/chat/completions", body};
}
async function pgRun(){
  let req; try{ req = pgRequest(); }catch(e){ return toast(e.message, true); }
  const out = $("#pgout"), toks = [], started = performance.now(); let text = "", stats = null;
  out.innerHTML = `<div class="tokens"></div>`; const box = $(".tokens", out);
  $("#pggo").classList.add("busy"); put($("#pgstat"), "");
  const add = (t, p, alts) => {
    toks.push({t, p, alts});
    const s = document.createElement("span"); s.textContent = t; s.className = "tok";
    if (p != null){ s.style.background = probColor(p); s.dataset.tip = `${Math.round(p * 100)}% sure|${(alts || []).map(a => `${JSON.stringify(a.t)} ${pct2(a.p)}`).join(" · ")}`; }
    box.append(s);
  };
  try{
    await llm(req.path, req.body, "playground", j => {
      if (req.path === "completion"){
        const probs = j.completion_probabilities?.[0];
        if (probs) add(probs.token ?? j.content, Math.exp(probs.logprob ?? -99), (probs.top_logprobs || []).map(a => ({t: a.token, p: Math.exp(a.logprob)})));
        else if (j.content) add(j.content);
        if (j.timings) stats = j.timings;
      } else {
        const c = j.choices?.[0]; const piece = c?.delta?.content;
        const lp = c?.logprobs?.content || [];
        if (lp.length) for (const x of lp) add(x.token, Math.exp(x.logprob), (x.top_logprobs || []).map(a => ({t: a.token, p: Math.exp(a.logprob)})));
        else if (piece) add(piece);
        if (j.timings) stats = j.timings;
      }
    });
  }catch(e){ toast(e.message, true); }
  text = toks.map(x => x.t).join("");
  const known = toks.filter(x => x.p != null), avg = known.length ? known.reduce((a, x) => a + x.p, 0) / known.length : null;
  put($("#pgstat"), `${toks.length} tokens${stats ? ` · ${stats.predicted_per_second.toFixed(1)} t/s · prompt ${stats.prompt_n} tokens` : ""}${avg != null ? ` · average certainty ${pct2(avg)}` : ""} · ${((performance.now() - started) / 1000).toFixed(1)} s`);
  if (req.body.response_format || req.body.grammar){ let ok = true; if (req.body.response_format){ try{ JSON.parse(text); }catch{ ok = false; } } out.insertAdjacentHTML("beforeend", `<div class="badge ${ok ? "good" : "bad"}" style="margin-top:10px">${ok ? "Valid output" : "Doesn't parse"}</div>`); }
  $("#pggo").classList.remove("busy");
}

async function tkRun(){

// The browser records raw samples, written out as a 16-bit WAV, which llama.cpp reads.
const REC = {ctx: null, node: null, stream: null, chunks: [], rate: 16000};
async function recToggle(){
  const b = $("#sttrec");
  if (REC.ctx){
    REC.node.disconnect(); REC.stream.getTracks().forEach(t => t.stop()); const rate = REC.ctx.sampleRate; await REC.ctx.close(); REC.ctx = null;
    b.innerHTML = ic("mic") + "Record"; b.classList.remove("d");
    const n = REC.chunks.reduce((a, c) => a + c.length, 0), all = new Float32Array(n); let o = 0; for (const c of REC.chunks){ all.set(c, o); o += c.length; }
    return sttSend(wav(all, rate), "wav");
  }
  try{
    REC.stream = await navigator.mediaDevices.getUserMedia({audio: true}); REC.ctx = new AudioContext(); REC.chunks = [];
    const src = REC.ctx.createMediaStreamSource(REC.stream); REC.node = REC.ctx.createScriptProcessor(4096, 1, 1);
    REC.node.onaudioprocess = e => REC.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    src.connect(REC.node); REC.node.connect(REC.ctx.destination);
    b.innerHTML = ic("stop") + "Stop"; b.classList.add("d"); put($("#sttstat"), "Recording…");
  }catch(e){ toast("The microphone isn't available: " + e.message, true); }
}
function wav(samples, rate){
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf), w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, samples.length * 2, true);
  samples.forEach((s, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s)) * 0x7fff, true));
  let bin = ""; const bytes = new Uint8Array(buf); for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode(...bytes.subarray(i, i + 32768));
  return btoa(bin);
}
async function sttSend(data, format){
  const out = $("#sttout"); out.replaceChildren(); put($("#sttstat"), "Listening…"); let text = "";
  try{
    await llm("v1/chat/completions", {model: $("#sttmodel").value, stream: true, messages: [{role: "user", content: [{type: "text", text: $("#sttask").value}, {type: "input_audio", input_audio: {data, format}}]}]}, "speech", j => {
      text += j.choices?.[0]?.delta?.content || ""; out.replaceChildren(); md(out, splitThinking(text).answer);
    });
    put($("#sttstat"), "Done.");
  }catch(e){ put($("#sttstat"), ""); toast(e.message.includes("audio") ? e.message : `${e.message} This model may not take audio.`, true); }
}

async function seAdd(files){
  const V = VIEWS.search, model = $("#semodel").value; if (!model) return toast("Get an embedding model under Hugging Face › Embedding.", true);
  for (const f of files){
    if (f.size > 8e6){ toast(`${f.name} is over 8 MB.`, true); continue; }
    const text = await f.text(), parts = [];
    for (let i = 0; i < text.length; i += 700) parts.push(text.slice(Math.max(0, i - 100), i + 700).trim());
    put($("#sestat"), `Embedding ${f.name}…`);
    for (let i = 0; i < parts.length; i += 32){
      const batch = parts.slice(i, i + 32);
      try{
        const r = await llm("v1/embeddings", {model, input: batch}, "search");
        r.data.forEach((d, k) => V.chunks.push({doc: f.name, text: batch[k], vec: d.embedding}));
      }catch(e){ toast(e.message, true); return put($("#sestat"), ""); }
    }
    V.docs.push({name: f.name, parts: parts.length});
  }
  put($("#sestat"), `${V.chunks.length} passages from ${V.docs.length} file${V.docs.length === 1 ? "" : "s"}`);
  put($("#sedocs"), V.docs.map(d => `<div>${ic("file")} ${esc(d.name)} · ${d.parts} passages</div>`).join(""));
}
async function seRun(){
  const V = VIEWS.search, q = $("#seq").value.trim(), model = $("#semodel").value, rr = $("#sererank").value;
  if (!q || !V.chunks.length) return toast(V.chunks.length ? "Type a question." : "Add files first.", true);
  try{
    const e = (await llm("v1/embeddings", {model, input: [q]}, "search")).data[0].embedding;
    const cos = (a, b) => { let d = 0, x = 0, y = 0; for (let i = 0; i < a.length; i++){ d += a[i] * b[i]; x += a[i] * a[i]; y += b[i] * b[i]; } return d / Math.sqrt(x * y); };
    let hits = V.chunks.map(c => ({...c, score: cos(e, c.vec)})).sort((a, b) => b.score - a.score).slice(0, rr ? 20 : 8);
    if (rr){
      const r = await llm("v1/rerank", {model: rr, query: q, documents: hits.map(h => h.text)}, "search");
      hits = r.results.map(x => ({...hits[x.index], rerank: x.relevance_score})).sort((a, b) => b.rerank - a.rerank).slice(0, 8);
    }
    put($("#seout"), hits.map(h => `<div class="card" style="padding:12px;box-shadow:none"><div class="row" style="justify-content:space-between"><span class="sub">${ic("file")} ${esc(h.doc)}</span><span class="badge acc"${tipAttr("Similarity|Cosine similarity between the question and the passage, from 0 to 1." + (h.rerank != null ? " The reranker's score is shown too." : ""))}>${h.score.toFixed(3)}${h.rerank != null ? ` · ${h.rerank.toFixed(3)}` : ""}</span></div><div style="margin-top:6px;white-space:pre-wrap">${esc(h.text)}</div></div>`).join(""));
  }catch(err){ toast(err.message, true); }
}

async function imageMake(){
  const V = VIEWS.images, prompt = $("#iprompt").value.trim(), size = $("#isize").value, btn = $("#igo");
  if (!prompt) return toast("Describe the picture first.", true);
  const [w, h] = size === "custom" ? [+$("#iw").value, +$("#ih").value] : size.split("x").map(Number);
  const opt = {steps: $("#isteps").value, cfg: $("#icfg").value, seed: $("#iseed").value, count: $("#icount").value, sampler: $("#isampler").value, sched: $("#isched").value, neg: $("#ineg").value};

  tick(); clearInterval(V.timer); V.timer = setInterval(tick, 1000);
  try{
    const num = v => v === "" ? undefined : +v;
    const r = await api("images/make", {prompt, width: w, height: h, steps: num(opt.steps), cfg: num(opt.cfg), seed: num(opt.seed), count: num(opt.count), sampler: opt.sampler, scheduler: opt.sched, negative: opt.neg});

}

  if (d.presetnew) return modal(`New preset of ${d.presetnew}`, `<div class="grid" style="gap:12px"><label class="field"><span>Name</span><input id="pname" placeholder="long" maxlength="31"></label><div class="field"><span>Start from</span><div class="row">${Object.entries(PRESET_TEMPLATES).map(([k, [l, v]]) => `<button class="btn sm" data-ptpl="${k}" title="${esc(l)}|${esc(Object.entries(v).map(([a, b]) => a + " = " + b).join(", "))}">${l}</button>`).join("")}</div></div><div id="pkv"></div><p class="sub" style="margin:0">Only the settings that differ from ${esc(d.presetnew)}. Apps ask for it as <code>${esc(d.presetnew)}:name</code>.</p></div>`, `<button class="btn" data-close>Cancel</button><button class="btn p" data-pcreate="${esc(d.presetnew)}">Create</button>`), kvEditor($("#pkv"), "preset", {}), $("#pkv .row:last-child")?.remove();
  if (d.ptpl){ const [l, v] = PRESET_TEMPLATES[d.ptpl]; if (!$("#pname").value) $("#pname").value = d.ptpl; kvEditor($("#pkv"), "preset", v); $("#pkv .row:last-child")?.remove(); return; }
  if (d.pcreate){ const r = await act("preset", {model: d.pcreate, name: $("#pname").value.trim(), values: readKV($("#pkv")).values}, t); if (r){ closeAll(); setTimeout(() => modelDrawer(r.name), 400); } return; }
  if (d.cbell != null){ const on = !store.get("chat.bell", true); store.set("chat.bell", on); t.innerHTML = ic(on ? "bell" : "belloff"); if (on) chime(); return toast(on ? "Waddle will chime when an answer finishes in the background." : "No sound when answers finish."); }
  if (t.id === "igo") return imageMake();
  if (d.ifolder != null) return act("images/folder");
  if (d.ireuse){ const p = VIEWS.images.pics.find(x => x.name === d.ireuse); $("#iprompt").value = p?.prompt || ""; $("#iprompt").focus(); return; }
  if (d.idel){ await api("images/delete", {name: d.idel}).catch(e => toast(e.message, true)); VIEWS.images.pics = VIEWS.images.pics.filter(x => x.name !== d.idel); return galleryDraw(); }
  if (d.rec){
    t.classList.add("busy");
    try{
      const r = await api("recommend", {model: d.rec}), keys = Object.entries(r.values);
      put($("#mrecout"), keys.length ? `<dl class="facts">${keys.map(([k, v]) => `<dt class="mono">${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl><div class="row" style="margin-top:10px"><span class="sub grow">From ${esc(r.source)}</span><button class="btn p sm" data-recapply="${esc(d.rec)}" title="Write these values into this model's settings in ai.ini. The router restarts to use them.">Apply</button></div>`
        : `<p class="sub" style="margin:10px 0 0">The authors don't publish recommended values for this model, so llama.cpp's defaults apply.</p>`);
    }catch(err){ put($("#mrecout"), `<p class="sub" style="margin:10px 0 0;color:var(--warn)">${esc(err.message)}</p>`); }
    t.classList.remove("busy"); return;
  }
  if (d.recapply){ await act("recommend", {model: d.recapply, apply: true}, t); const v = await api("details", {model: d.recapply}).catch(() => null); if (v && drawerFor === "m:" + d.recapply) kvEditor($("#mkv"), d.recapply, v.values); return; }
  if (d.crename){
    const c = CH.list.find(x => x.id === d.crename);
    modal("Rename chat", `<input id="cname" style="width:100%" maxlength="80" value="${esc(c?.title || "")}">`, `<button class="btn" data-close>Cancel</button><button class="btn p" data-crsave="${esc(d.crename)}">Save</button>`);
    return setTimeout(() => $("#cname")?.select(), 30);
  }
  if (d.crsave){
    const title = $("#cname").value.trim() || "Untitled"; closeAll();
    try{ const c = CH.cur?.id === d.crsave ? CH.cur : await api("chats/get", {id: d.crsave}); c.title = title; await api("chats/save", {chat: c}); }catch(err){ toast(err.message, true); }
    await chatList(); return chatBar();
  }
  if (d.cdel) return modal("Delete this chat?", `<p class="dim" style="margin:0">${esc(CH.list.find(x => x.id === d.cdel)?.title || "")}</p>`, `<button class="btn" data-close>Cancel</button><button class="btn d" data-cdelnow="${esc(d.cdel)}">${ic("trash")}Delete</button>`);
  if (d.cdelnow){
    closeAll(); await api("chats/delete", {id: d.cdelnow}).catch(() => {});
    CH.list = CH.list.filter(x => x.id !== d.cdelnow); if (CH.cur?.id === d.cdelnow) chatNew(); return chatRows();
  }
  if (d.chat) return chatOpen(d.chat);
  if (d.csettings != null) return chatSettings();
  if (d.csave != null || d.cdefaults != null){
    const v = readChatSettings();
    if (d.cdefaults != null){ store.set("chat.defaults", v); toast("New chats start with these."); }
    if (CH.cur){ CH.cur.settings = v; chatSave(); }
    closeAll(); return ctxMeter();
  }
  if (d.cexport != null){ if (!CH.cur?.messages.length) return toast("Nothing to copy yet.", true); await navigator.clipboard.writeText(chatMarkdown(CH.cur)); return toast("The chat is copied as Markdown."); }
  if (d.cattach != null) return $("#cfile").click();
  if (t.id === "csend") return chatSend();
  if (d.sug){ const i = $("#cin"); i.value = d.sug; growInput(); i.focus(); return; }
  if (d.copytext != null){ await navigator.clipboard.writeText(d.copytext); return toast("Copied, with your key in it."); }
  if (d.copycode != null){ await navigator.clipboard.writeText($("pre", t.closest(".code")).textContent); return toast("Code copied."); }
  if (d.unchip != null){ CH.files.splice(+d.unchip, 1); return chipsDraw(); }
  if (d.mcopy != null){ const x = CH.cur.messages[+d.mcopy]; await navigator.clipboard.writeText(x.role === "user" ? x.content : splitThinking(x.content).answer); return toast("Copied."); }
  if (d.mdel != null){ if (CH.run) return; CH.cur.messages.splice(+d.mdel, 1); chatDraw(); return chatSave(); }
  if (d.medit != null){
    if (CH.run) return;
    const x = CH.cur.messages[+d.medit]; CH.cur.messages.splice(+d.medit);
    CH.files = [...(x.files || []), ...(x.images || []).map((url, k) => ({name: `Image ${k + 1}`, url}))];
    $("#cin").value = x.content; chatDraw(); chipsDraw(); growInput(); $("#cin").focus(); return;
  }
  if (d.mretry != null){
    if (CH.run) return;
    const msgs = CH.cur.messages; if (msgs[msgs.length - 1]?.role === "assistant") msgs.pop();
    chatDraw(); return chatAsk();
  }
  if (d.page) return go(d.page);
  if (d.mtab) return modelDrawer(drawerFor.slice(2), d.mtab);
  if (d.model && !e.target.closest("button")) return modelDrawer(d.model);
  if (d.repo) return hubOpen(d.repo);
  if (d.kind){ hubRead(); Object.assign(VIEWS.hub.q, {kind: d.kind, license: "", arch: "", tags: [], limit: 100}); built = ""; draw(); return; }
  if (d.hfacet){ const q = VIEWS.hub.q, v = d.hval; if (d.hfacet === "license" || d.hfacet === "arch"){ q[d.hfacet] = q[d.hfacet] === v ? "" : v; return hubTable(); } if (!q.tags.includes(v)) q.tags.push(v); q.limit = 100; return hubSearch(); }
  if (d.huntag){ const q = VIEWS.hub.q; q.tags = q.tags.filter(x => x !== d.huntag); return hubSearch(); }
  if (d.hmore != null){ VIEWS.hub.q.limit = Math.min(500, VIEWS.hub.q.limit + 100); return hubSearch(); }
  if (t.id === "hgo"){ hubRead(); return hubSearch(); }
  if (d.htab){ VIEWS.hub.tab = d.htab; return hubDrawer(); }
  if (d.load) return act("load", {model: d.load}, t);
  if (d.unload) return act("unload", {model: d.unload}, t);
  if (d.install) return act("install", {what: d.install}, t);
  if (d.act === "doctor-ui") return runChecks(t);
  if (d.act) return act(d.act, {}, t);
  if (d.folder != null) return act("folder", {what: d.folder});
  if (d.addfile) return act("addfile", {file: d.addfile}, t).then(() => { built = ""; draw(); });
  if (d.copy != null){ await navigator.clipboard.writeText(d.copy); return toast("Copied to clipboard."); }
  if (d.copykey != null){ await navigator.clipboard.writeText((await api("access")).key); return toast("API key copied."); }
  if (d.key != null){ const el = $("#keytext"); const show = el.textContent.startsWith("•"); el.textContent = show ? (await api("access")).key : "•".repeat(24); t.innerHTML = ic("eye") + (show ? "Hide key" : "Show key"); return; }
  if (d.dl) return act("dl", {name: d.name, action: d.dl}, t);
  if (d.log != null){ VIEWS.logs.name = d.log; VIEWS.logs.text = null; return go("logs"); }
  if (d.hubimage != null){ VIEWS.hub.q.kind = "image"; return go("hub"); }
  if (d.rm != null){ const k = t.previousElementSibling.previousElementSibling; k.dataset.gone = "1"; [k, t.previousElementSibling, t].forEach(x => x.style.display = "none"); return; }
  if (d.addkv != null){ const kv = $(".kv", t.closest(".body,#mkv,.dbody,#iset,#defaults")); kv.insertAdjacentHTML("beforeend", `<input data-k list="keys" placeholder="setting"><input data-v placeholder="value"><button type="button" class="btn icon sm ghost" data-rm>${ic("x")}</button>`); $$("[data-k]", kv).pop().focus(); return; }
  if (d.savekv != null){ const el = t.closest("#mkv,#iset,#defaults"), f = readKV(el); el._sig = null; return act("edit", {model: f.section, values: f.values}, t); }
  if (d.bench){ t.classList.add("busy"); try{ const r = await api("benchmark", {model: d.bench}); modal(`Benchmark · ${d.bench}`, `<div class="grid g4" style="grid-template-columns:repeat(2,1fr)">${[["Writing", r.write + " t/s"], ["Reading", r.read + " t/s"], ["Tokens", r.tokens], ["Wall time", r.seconds + " s"]].map(([k, v]) => `<div class="card tile" style="box-shadow:none"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div><p class="sub">A short prompt. Speed drops as context fills.</p>`, `<button class="btn" data-close>Close</button>`); }catch(x){ toast(x.message, true); } t.classList.remove("busy"); return; }
  if (d.remove){ return modal(`Remove ${d.remove}?`, `<p class="dim" style="margin-top:0">It's taken out of ai.ini.</p><label class="check"><input type="checkbox" id="rmfiles">Also delete its files from models/</label>`, `<button class="btn" data-close>Cancel</button><button class="btn d solid" data-confirmremove="${esc(d.remove)}">${ic("trash")}Remove</button>`); }
  if (d.confirmremove){ const files = $("#rmfiles")?.checked; closeAll(); return act("remove", {model: d.confirmremove, files}); }
  if (d.hdl != null){
    const V = VIEWS.hub, f = V.files, sel = V.sel, image = ["image", "upscaler"].includes(V.q.kind);
    if (!hubPicked().length) return toast("Pick a file first.", true);
    const body = image ? {repo: drawerFor.slice(2), kind: V.q.kind, paths: [...sel.extra]}
      : {repo: drawerFor.slice(2), kind: V.q.kind === "any" ? "text" : V.q.kind, paths: [sel.main], vision: sel.vision ? f.vision : "", mtp: sel.mtp ? f.mtp : "", extra: [...sel.extra]};
    const r = await act("download", body, t); if (r){ closeAll(); }
    return;
  }
  if (d.unused != null){ const r = await api("unused"); return modal("Unused files", r.items.length ? `<div class="tw"><table><tbody>${r.items.map(i => `<tr><td class="mono">${esc(i.name)}</td><td class="num">${gb(i.size)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">${ic("check")}Nothing unused.</div>`, r.items.length ? `<button class="btn" data-close>Keep</button><button class="btn d solid" data-delunused>${ic("trash")}Delete ${r.items.length}</button>` : `<button class="btn" data-close>Close</button>`); }
  if (d.delunused != null){ closeAll(); return act("unused", {delete: true}); }
  if (d.updates != null){ t.classList.add("busy"); try{ const u = await api("updates"); put($("#upd"), `Waddle ${esc(u.waddle)}${u.waddle_latest && u.waddle_latest !== u.waddle ? ` → <b>${esc(u.waddle_latest)}</b> <button class="btn p sm" data-update>Update</button>` : " · up to date"} · llama.cpp ${esc(u.llama || "—")}${u.llama_latest && u.llama_latest !== u.llama ? ` → <b>${esc(u.llama_latest)}</b>` : ""}`); }catch(x){ toast(x.message, true); } t.classList.remove("busy"); return; }
  if (d.update != null) return act("update", {}, t);
  if (d.saveidle != null) return act("settings", {idle: +$("#idle").value}, t);
  if (d.themeSet != null){ store.set("theme", d.themeSet); applyLook(); $$("#themeseg button").forEach(b => b.classList.toggle("on", b === t)); segThumb($("#themeseg")); drawCharts(); return; }
  if (d.accent){ store.set("accent", d.accent); applyLook(); $$(".sw").forEach(s => s.classList.toggle("on", s === t)); drawCharts(); return; }
  if (d.quit != null) return quitAsk();
  if (d.quitnow != null){ closeAll(); await api("quit").catch(() => {}); document.body.innerHTML = `<div style="margin:auto;text-align:center;color:var(--dim)"><h2 style="color:var(--text);margin-bottom:6px">Waddle has stopped</h2>Open it again from its icon.</div>`; return; }
  if (t.closest("#tabs") && d.page == null) return;
});
document.addEventListener("change", async e => {
  const t = e.target, d = t.dataset;
  if (t.id === "llbuild") act("llama/use", {build: t.value});
  if (d.apick){ const V = VIEWS.arena; V.picked = t.checked ? [...new Set([...V.picked, d.apick])].slice(-4) : V.picked.filter(x => x !== d.apick); built = ""; draw(); }
  if (t.id === "pgformat"){ pgSettings(); built = ""; draw(); }
  if (t.id === "sttpick" && t.files[0]){ const f = t.files[0], data = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result.split(",")[1]); r.readAsDataURL(f); }); t.value = ""; sttSend(data, f.name.toLowerCase().endsWith(".mp3") ? "mp3" : "wav"); }
  if (t.id === "sepick"){ seAdd([...t.files]); t.value = ""; }
  if (t.id === "isize"){ $("#icustom").hidden = t.value !== "custom"; }
  if (t.id === "draftsel") act("draft/set", {model: drawerFor.slice(2), draft: t.value});
  if (d.lora){ const files = $$("[data-lora]").filter(x => x.checked).map(x => x.dataset.lora); act("lora/set", {model: drawerFor.slice(2), files}); }
  if (t.id === "cperm" && CH.cur){ CH.cur.permission = t.value; store.set("agent.permission", t.value); chatBar(); if (CH.cur.id) api("agent/permission", {id: CH.cur.id, permission: t.value}).catch(() => {}); }
  if (d.flag) act("flag", {model: drawerFor.slice(2), key: d.flag, on: t.checked});
  if (t.id === "bkpick" && t.files[0]){ const f = t.files[0]; const data = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result.split(",")[1]); r.readAsDataURL(f); }); t.value = ""; const r = await act("restore", {data}); if (r){ backupsLoad(); chatList(); } }
  if (t.id === "cmodel" && CH.cur){ CH.cur.model = t.value; store.set("chat.model", t.value); chatBar(); }
  if (t.id === "cfile"){ addFiles([...t.files]); t.value = ""; }
  if (d.set) act("settings", {[d.set]: t.checked});
  if (d.startup != null) act("startup", {on: t.checked});
  if (d.feature) act("feature", {model: drawerFor.slice(2), feature: d.feature, on: t.checked});
  if (t.id === "logname"){ VIEWS.logs.name = t.value; VIEWS.logs.text = null; $("#log")._seen = false; VIEWS.logs.update(); }
  if (t.id === "logfollow") VIEWS.logs.follow = t.checked;
  if (t.id === "hlic" || t.id === "harch"){ VIEWS.hub.q[t.id === "hlic" ? "license" : "arch"] = t.value; return hubTable(); }
  if (t.id === "hlang" || t.id === "htag"){ const q = VIEWS.hub.q; if (t.id === "hlang") q.tags = q.tags.filter(x => !/^[a-z]{2}$/.test(x)); if (t.value && !q.tags.includes(t.value)) q.tags.push(t.value); q.limit = 100; return hubSearch(); }
  if (d.f || ["hsort","hmin","hmax","hctx"].includes(t.id)){ hubRead(); if (t.id === "hsort" || d.f === "gguf") hubSearch(); else hubTable(); }
  const V = VIEWS.hub;
  if (t.name === "hmain"){ V.sel.main = t.value; hubDrawer(); }
  if (t.id === "hvision"){ V.sel.vision = t.checked; hubDrawer(); }
  if (t.id === "hmtp"){ V.sel.mtp = t.checked; hubDrawer(); }
  if (t.classList.contains("xf")){
    const f = V.files, p = t.value;
    if (p === f.vision) V.sel.vision = t.checked; else if (p === f.mtp) V.sel.mtp = t.checked;
    else if (p === V.sel.main && !t.checked && V.q.kind === "text") t.checked = true;
    else t.checked ? V.sel.extra.add(p) : V.sel.extra.delete(p);
    hubDrawer();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "logfilter") showLog();
  if (e.target.id === "cin") growInput();
  if (e.target.id === "cq"){ CH.q = e.target.value; chatRows(); }
  if (e.target.type === "range"){ const o = e.target.nextElementSibling; if (o?.tagName === "OUTPUT") o.textContent = e.target.value; }
});
document.addEventListener("paste", e => { if (e.target.id === "cin" && e.clipboardData?.files.length){ e.preventDefault(); addFiles([...e.clipboardData.files]); } });
document.addEventListener("dragover", e => { if (e.target.closest?.(".cmain") && e.dataTransfer?.types.includes("Files")){ e.preventDefault(); $("#cbox")?.classList.add("drop"); } });
document.addEventListener("dragleave", e => { if (!e.relatedTarget?.closest?.(".cmain")) $("#cbox")?.classList.remove("drop"); });
document.addEventListener("drop", e => { if (e.target.closest?.(".cmain")){ e.preventDefault(); $("#cbox")?.classList.remove("drop"); addFiles([...e.dataTransfer.files]); } });

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); return $("#palette").classList.contains("on") ? closeAll() : palette(); }
  if (e.target.id === "cin" && e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); return chatSend(); }
  if (e.target.id === "iprompt" && e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); return imageMake(); }
  if (e.target.id === "pgprompt" && e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); return pgRun(); }
  if (e.target.id === "seq" && e.key === "Enter"){ e.preventDefault(); return seRun(); }
  if (e.target.id === "aprompt" && e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); return arenaRun(); }
  if (e.key === "Escape" && CH.run && page === "chat" && !$("#modal").classList.contains("on")) return CH.run.ctrl.abort();
  if (e.key === "Escape" && page === "chat" && agentMode() && CH.cur.running && !$("#modal").classList.contains("on")) return chatSend();
  if (e.key === "Escape") return closeAll();
  if (e.key === "Enter" && ["hq","hauthor"].includes(e.target.id)){ hubRead(); hubSearch(); }
});
addEventListener("hashchange", () => { const p = location.hash.slice(1), m = p.match(/^hub\/(.+)$/); if (m){ if (page !== "hub") go("hub"); return hubOpen(decodeURIComponent(m[1])); } if (p !== page && NAMES[p]) go(p); });
// a new repo resets the picks in the drawer
const _hubOpen = hubOpen; hubOpen = async repo => { VIEWS.hub.sel = null; VIEWS.hub.files = null; return _hubOpen(repo); };

buildNav(); refresh().then(() => { if (deep) hubOpen(decodeURIComponent(deep[1])); if (deepModel) modelDrawer(decodeURIComponent(deepModel[1])); }); pollLive();
</script>
