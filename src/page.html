  const allOn = chosen.length === I.models.length;
  put($("#cnmodels"), I.models.length ? `<div class="row" style="margin:0 0 .625rem;gap:.5rem"><span class="sub grow">${chosen.length} of ${I.models.length} in the settings on the right. Apps that take one model use the first.</span><button class="btn sm ghost" data-cnall="${allOn ? "none" : "all"}">${allOn ? "Clear" : "Select all"}</button><button class="btn sm ghost" data-copy="${esc(ids.join("\n"))}" title="Copy names|Copies the ticked models' names, one per line."${ids.length ? "" : " disabled"}>${ic("copy")}Copy names</button></div>` + I.models.map(m => `<div class="endpoint pick${V.off.has(m.id) ? "" : " on"}" data-cnpick="${esc(m.id)}" title="Include ${esc(m.id)} in the settings on the right, or leave it out."><input type="checkbox" tabindex="-1" ${V.off.has(m.id) ? "" : "checked"} style="pointer-events:none;flex:none"><div class="grow" style="min-width:0"><code style="overflow-wrap:anywhere">${esc(m.id)}</code><div class="sub">${big(m.context)} context${m.vision ? " · vision" : ""}${m.thinking ? " · thinking" : ""}</div></div><button class="btn icon sm ghost" data-copy="${esc(m.id)}" title="Copy the model name.">${ic("copy")}</button></div>`).join("") : `<div class="empty">No models yet.</div>`);
  $$("#cntabs button").forEach(b => b.classList.toggle("on", b.dataset.cntab === tab));
  // the key is masked on screen and filled in when copied
  const MASK = "•".repeat(12) + I.key.slice(-4);
  const code = (lang, text, note = "") => `${note ? `<p class="sub" style="margin-top:0">${note}</p>` : ""}<div class="code"><header><span>${lang}</span><button class="btn ghost" data-copytext="${esc(text)}" title="Copy, with the real key in it.">${ic("copy")}Copy</button></header><pre><code>${esc(text.replaceAll(I.key, MASK))}</code></pre></div>`;
  const K = I.key, snippets = {
    pi: (I.pi ? `<div class="row" style="margin-bottom:.75rem"><button class="btn p" data-cnpi ${ids.length ? "" : "disabled"}>${ic("plug")}Add ${allOn ? "all" : chosen.length} model${chosen.length === 1 ? "" : "s"} to pi</button><span class="sub grow">Writes a "waddle" provider into <code>~/.pi/agent/models.json</code>, keeps your other providers, and backs the file up first.</span></div>` : `<p class="sub">pi isn't set up yet. Install it from pi.dev, run it once, then come back. Or add this to <code>~/.pi/agent/models.json</code> yourself:</p>`)
      + code("~/.pi/agent/models.json", JSON.stringify({providers: {waddle: {name: "Waddle (local)", baseUrl: base, api: "openai-completions", apiKey: K, models: chosen.map(m => ({id: m.id, name: m.id, contextWindow: m.context, maxTokens: Math.min(m.context, 32768), reasoning: !!m.thinking, input: m.vision ? ["text", "image"] : ["text"]}))}}}, null, 2)),
    claude: code(cfgShell(), `${envLine("ANTHROPIC_BASE_URL", root)}\n${envLine("ANTHROPIC_AUTH_TOKEN", K)}\n${envLine("ANTHROPIC_MODEL", model)}\n${envLine("ANTHROPIC_SMALL_FAST_MODEL", model)}\nclaude`, "Claude Code speaks Anthropic's API, which llama.cpp serves at /v1/messages. Set these, then start claude. Agent work needs a capable model with tool calling and a large context."),
    continue: `<div class="row" style="margin-bottom:.75rem"><button class="btn p" data-cncontinue>${ic("plug")}Add ${chosen.length === I.models.length ? "all" : chosen.length} model${chosen.length === 1 ? "" : "s"} to Continue</button><span class="sub grow">Writes them into <code>~/.continue/config.yaml</code> between marker lines, keeps everything else, and backs the file up first.</span></div>` + code("~/.continue/config.yaml", `models:\n${chosen.map(m => `  - name: ${m.id}\n    provider: openai\n    model: ${m.id}\n    apiBase: ${base}\n    apiKey: ${K}\n    defaultCompletionOptions:\n      contextLength: ${m.context}`).join("\n")}`, "Continue for VS Code and JetBrains. Add these to your config's models."),
    opencode: code("opencode.json", JSON.stringify({"$schema": "https://opencode.ai/config.json", provider: {waddle: {npm: "@ai-sdk/openai-compatible", name: "Waddle", options: {baseURL: base, apiKey: K}, models: Object.fromEntries(chosen.map(m => [m.id, {name: m.id, limit: {context: m.context, output: Math.min(m.context, 32768)}}]))}}}, null, 2), "OpenCode: put this in opencode.json in your project, or in ~/.config/opencode/, then pick a Waddle model with /models."),
    aider: code(cfgShell(), `aider --openai-api-base ${base} --openai-api-key ${K} --model openai/${model}`, "Aider: run this in your project. The openai/ prefix tells Aider it's an OpenAI-compatible endpoint."),
    zed: code("Zed › settings.json", JSON.stringify({language_models: {openai_compatible: {Waddle: {api_url: base, available_models: chosen.map(m => ({name: m.id, display_name: m.id, max_tokens: m.context}))}}}}, null, 2), "Zed: add this to settings.json, then paste the key when Zed asks for Waddle's API key in the Agent panel."),
    vscode: code("VS Code › settings.json", JSON.stringify({"github.copilot.chat.customOAIModels": Object.fromEntries(chosen.map(m => [m.id, {name: m.id, url: base, toolCalling: true, vision: !!m.vision, maxInputTokens: m.context, maxOutputTokens: Math.min(m.context, 8192), requiresAPIKey: true}]))}, null, 2), "VS Code with GitHub Copilot Chat: add this to settings.json, then choose Manage Models › OpenAI Compatible and paste the key."),
    librechat: code("librechat.yaml", `endpoints:\n  custom:\n    - name: "Waddle"\n      apiKey: "${K}"\n      baseURL: "${base.replace("127.0.0.1", "host.docker.internal")}"\n      models:\n        default: [${chosen.map(m => `"${m.id}"`).join(", ")}]\n        fetch: true\n      titleConvo: true\n      titleModel: "${model}"`, "LibreChat: add this to librechat.yaml. From Docker, your computer is host.docker.internal."),
    jan: code("Jan › Settings › Model Providers", `Add provider: OpenAI compatible\nBase URL: ${base}\nAPI key: ${K}\nModels: ${ids.join(", ") || model}`, "Jan: add a provider with these fields, then pick a Waddle model in a chat."),
    openwebui: code("Docker", `docker run -d -p 3000:8080 \\\n  -e OPENAI_API_BASE_URL=${base.replace("127.0.0.1", "host.docker.internal")} \\\n  -e OPENAI_API_KEY=${K} \\\n  ghcr.io/open-webui/open-webui:main`, "Or in Open WebUI: Settings › Connections › OpenAI API, with the address and key above. From Docker, the PC is host.docker.internal."),
    sillytavern: code("API Connections", `API: Chat Completion\nSource: Custom (OpenAI-compatible)\nCustom Endpoint (Base URL): ${base}\nCustom API Key: ${K}\nModel: ${model}`, "In SillyTavern, open API Connections and fill in these fields."),
    cursor: code("Cursor › Settings › Models", `OpenAI API Key: ${K}\nOverride OpenAI Base URL: ${base}\n${(ids.length ? ids : [model]).map(i => `Add model: ${i}`).join("\n")}`, "Cursor sends requests from its own servers, so it can only reach Waddle if this PC is reachable from the internet, for example through a tunnel. Local editors such as Continue don't need that."),
    python: code("Python", `from openai import OpenAI  # pip install openai\n\nclient = OpenAI(base_url="${base}", api_key="${K}")\n${ids.length > 1 ? `# also: ${ids.slice(1).join(", ")}\n` : ""}reply = client.chat.completions.create(\n    model="${model}",\n    messages=[{"role": "user", "content": "Hello!"}],\n)\nprint(reply.choices[0].message.content)`),
    js: code("JavaScript", `import OpenAI from "openai"; // npm install openai\n\nconst client = new OpenAI({ baseURL: "${base}", apiKey: "${K}" });\n${ids.length > 1 ? `// also: ${ids.slice(1).join(", ")}\n` : ""}const reply = await client.chat.completions.create({\n  model: "${model}",\n  messages: [{ role: "user", content: "Hello!" }],\n});\nconsole.log(reply.choices[0].message.content);`),
    curl: code("curl", `curl ${base}/chat/completions \\\n  -H "Authorization: Bearer ${K}" \\\n  -H "Content-Type: application/json" \\\n  -d '{"model": "${model}", "messages": [{"role": "user", "content": "Hello!"}]}'`),
  };
  put($("#cnbody"), `<div class="row" style="justify-content:flex-end;margin-bottom:.5rem"><span class="sub grow" id="cntest"></span><button class="btn sm ghost" data-cntest title="Test the connection|Asks the endpoint for its models with your key, as an app would.">${ic("check")}Test connection</button></div>` + snippets[tab]);
}
const cfgShell = () => navigator.platform.startsWith("Win") ? "PowerShell" : "bash";
const envLine = (k, v) => navigator.platform.startsWith("Win") ? `$env:${k} = "${v}"` : `export ${k}="${v}"`;

/* ================= models: tune, evals, library, LoRA, drafts ================= */
async function libraryLoad(){
  try{ const r = await api("library"); const el = $("#library"); if (!el) return;
    const copies = r.files.filter(f => f.copies), newer = r.files.filter(f => f.newer), unused = r.files.filter(f => !f.used_by.length);
    put(el, `<div class="row" style="gap:1.125rem;margin-bottom:.625rem"><div><b style="font-size:1.25rem">${gb(r.total / 2**30)}</b><div class="sub">in models/</div></div>${r.free != null ? `<div><b style="font-size:1.25rem">${gb(r.free / 2**30)}</b><div class="sub">free on this drive</div></div>` : ""}<div><b style="font-size:1.25rem">${r.files.length}</b><div class="sub">files</div></div></div>
      ${copies.length ? `<p class="sub" style="color:var(--warn)">${ic("alert")} Possible copies: ${copies.map(f => `<code>${esc(f.name)}</code>`).join(", ")}. Files of the same size are likely the same model twice.</p>` : ""}
      ${newer.length ? `<p class="sub">${ic("refresh")} Newer uploads on Hugging Face: the repo changed after you downloaded; the quantization may have been fixed.</p>${newer.map(f => `<div class="row" style="gap:.5rem;margin-bottom:.25rem"><code class="grow" style="overflow-wrap:anywhere">${esc(f.name)}</code><button class="btn sm" data-mrefresh="${esc(f.name)}" title="Download the new version|Downloads the newer upload beside the old file and swaps them when it's complete.">${ic("dl")}Get the new version</button></div>`).join("")}` : ""}
      ${unused.length ? `<p class="sub">${unused.length} file${unused.length === 1 ? "" : "s"} no model uses. <button class="btn sm ghost" data-unused>Review</button></p>` : `<p class="sub">Every file is in use.</p>`}`);
  }catch{}
}
async function tuneRun(model, btn){
  const ctx = +($("#tunectx")?.value || 32768), depths = [0, 8192, ctx].filter((v, i, a) => a.indexOf(v) === i && v <= ctx);
  btn.classList.add("busy"); put($("#tuneout"), `<p class="sub"><span class="spin"></span> Unloading models, fitting, and measuring speed at ${depths.map(big).join(", ")} tokens. This takes one to a few minutes.</p>`);
  try{ const r = await api("tune", {model, context: ctx, depths}); tuneShow(model, r); }catch(e){ put($("#tuneout"), `<p class="sub" style="color:var(--bad)">${esc(e.message)}</p>`); }
  btn.classList.remove("busy");
}
// Earlier results with the llama.cpp build they ran on, so a faster or slower build shows.
function historyHTML(list, value, title){
  if (!list || list.length < 2) return "";
  return `<details class="adv"><summary>${title} (${list.length})</summary><table class="mini"><tbody>${list.slice().reverse().map(h => `<tr><td class="sub">${new Date(h.t * 1000).toLocaleDateString()}</td><td class="mono sub">${esc(h.build || "—")}</td><td class="num">${value(h)}</td></tr>`).join("")}</tbody></table></details>`;
}
function tuneShow(model, r){
  if (!r || !$("#tuneout")) return;
  const fitted = Object.entries(r.fitted || {});
  put($("#tuneout"), `<table class="mini"><thead><tr><th class="num">Context used</th><th class="num"${tipAttr("Reading|Prompt processing speed: how fast the model reads what it's sent.")}>Reading</th><th class="num"${tipAttr("Writing|Generation speed: how fast the answer appears.")}>Writing</th></tr></thead><tbody>${r.rows.map(x => `<tr><td class="num">${big(x.depth)}</td><td class="num">${x.read ?? "—"} t/s</td><td class="num"><b>${x.write ?? "—"}</b> t/s</td></tr>`).join("")}</tbody></table>
    <p class="sub">${esc(r.backend || "")} · llama-fit-params chose <code>${esc(r.line || "nothing")}</code> for ${big(r.context)} tokens of context.</p>
    ${fitted.length ? `<button class="btn sm p" data-tuneapply="${esc(model)}" title="Apply|Writes these settings into the model's section of ai.ini. The router restarts to use them.">Use these settings</button>` : ""}
    ${historyHTML(r.history, h => `${h.write ?? "—"} t/s writing`, "Earlier tunes")}`);
  VIEWS.models.tuned = {...VIEWS.models.tuned, [model]: r};
}
async function evalsRun(model, btn){
  try{ await api("evals/run", {model}); }catch(e){ return toast(e.message, true); }
  btn?.classList.add("busy"); evalsWatch(model);
}
async function evalsWatch(model){
  const p = await api("evals/status").catch(() => null); if (!p) return;
  if (p.running){ put($("#evalout"), `<p class="sub"><span class="spin"></span> ${p.done} of ${p.total}${p.current ? ` · ${esc(p.current)}` : ""}</p><div class="meter"><i style="width:${p.done / p.total * 100}%;background:var(--accent)"></i></div>`); return setTimeout(() => evalsWatch(model), 1500); }
  if (p.error) toast(p.error, true);
  $("[data-evalrun]")?.classList.remove("busy"); evalsShow(model);
}
async function evalsShow(model){
  const r = await api("evals/results").catch(() => null), x = r?.results?.[model]; if (!$("#evalout")) return;
  if (!x) return put($("#evalout"), `<p class="sub">Not run yet. ${r?.suite?.length || 24} quick checks: maths, reasoning, following instructions, structured output, tool calls, and code. About a minute on a small model.</p>`);
  const others = Object.entries(r.results).filter(([k]) => k !== model).sort((a, b) => b[1].score - a[1].score).slice(0, 4);
  put($("#evalout"), `<div class="row" style="gap:1rem"><div><b style="font-size:1.5rem">${x.score}</b><span class="sub"> / ${x.total}</span></div><div class="grow">${Object.entries(x.categories).map(([c, v]) => `<div class="row" style="gap:.5rem;flex-wrap:nowrap"><span class="sub" style="width:8.125rem">${esc(c)}</span><div class="meter grow" style="margin:0"><i style="width:${v.pass / v.total * 100}%;background:var(--accent)"></i></div><span class="sub">${v.pass}/${v.total}</span></div>`).join("")}</div></div>
    <details style="margin-top:.5rem"><summary class="sub" style="cursor:pointer">Every answer</summary>${x.items.map(i => `<div class="row" style="gap:.5rem;margin-top:.375rem;flex-wrap:nowrap;align-items:flex-start"><span class="badge ${i.pass ? "good" : "bad"}">${i.pass ? "Pass" : "Fail"}</span><span class="mono sub" style="width:4.375rem">${esc(i.id)}</span><span class="sub" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(i.answer.slice(0, 300))}</span></div>`).join("")}</details>
    ${others.length ? `<p class="sub">Others: ${others.map(([k, v]) => `${esc(k)} ${v.score}/${v.total}`).join(" · ")}</p>` : ""}
    ${historyHTML(x.history, h => `${h.score}/${h.total}`, "Earlier checks")}`);
}
async function loraLoad(model){
  try{ const r = await api("lora", {model}); put($("#loraout"), r.adapters.length ? r.adapters.map(a => `<label class="switch" title="${esc(a.name)}|${esc(a.arch || "")} adapter. Attaching restarts the router."><input type="checkbox" data-lora="${esc(a.file)}" ${a.attached ? "checked" : ""}><i></i><span class="mono">${esc(a.name)}</span></label>`).join("")
    : `<p class="sub" style="margin:0">No adapters in models/. Find GGUF LoRAs under Find models › Text LoRA.</p>`); }catch{}
}
async function draftLoad(model, current){
  try{ const r = await api("drafts", {model}); put($("#draftout"), r.drafts.length ? `<select id="draftsel" title="Draft model|A small model of the same family guesses several tokens ahead and the big one checks them in one pass. Same answers, often 1.5 to 2.5 times faster writing, at the cost of the small model's VRAM."><option value="">None</option>${r.drafts.map(d => `<option value="${esc(d.name)}" ${d.file === current ? "selected" : ""}>${esc(d.name)} · ${d.size} GB</option>`).join("")}</select>`
    : `<p class="sub" style="margin:0">No installed model can draft for this one: a draft needs the same architecture, the same vocabulary, and a third of the size or less, usually a smaller model of the same family.</p><button class="btn sm" data-finddraft="${esc(model)}">${ic("search")}Find a draft model</button>`); }catch{}
}

    const f = V.fits;
    put(el, `<h2 class="big">Welcome to Waddle</h2><p class="lead">Your own AI, on this computer. First, what it can run.</p><p class="sub" style="margin:-.25rem 0 1rem">Waddle is beta software: expect rough edges, and report problems on GitHub.</p>
      ${card("This PC", "gpu", `<div class="body">${f ? `<div class="row" style="gap:1.75rem"><div><div class="sub">Graphics</div><b>${esc(f.gpu || "Not detected")}</b></div><div><div class="sub">Video memory</div><b>${f.vram ? f.vram.toFixed(1) + " GB" : "—"}</b></div><div><div class="sub">System memory</div><b>${f.ram.toFixed(1)} GB</b></div></div>` : `<div class="skel" style="height:2.5rem"></div>`}
        <div class="setting" style="margin-top:.875rem"><div class="grow"><b>llama.cpp</b><div class="sub">${S.server ? `Installed (${esc(S.llama)}). It runs the models.` : "The engine that runs models. Waddle downloads the right build for your graphics card."}</div></div>${S.server ? `<span class="badge good">${ic("check")}Ready</span>` : S.installing.llama ? `<span class="sub">${esc(S.installing.llama)}</span>` : `<button class="btn p" data-install="llama">${ic("dl")}Install</button>`}</div></div>`)}
      ${f ? card("What fits", "layers", fitsTable(f), "", "", "Typical model sizes against your hardware. Green runs fully on the graphics card; amber runs partly from system memory, which is slower. Bigger models are smarter and slower.") : ""}`);
  } else if (V.step === 1){
    if (!V.found){ put(el, `<h2 class="big">Models you already have</h2><p class="lead">Looking in Ollama, LM Studio, the Hugging Face cache, and other apps…</p><div class="skel" style="height:7.5rem"></div>`); V.found = await api("import/scan").catch(() => ({files: []})); }
    const fresh = V.found.files.filter(f => !f.have && f.kind === "model");
    put(el, `<h2 class="big">Models you already have</h2><p class="lead">${fresh.length ? `Waddle found ${fresh.length} model${fresh.length === 1 ? "" : "s"} from other apps. Take them in without copying: they're linked, so they use no extra space.` : "No models from other apps were found. That's fine: you'll pick one next."}</p>
      ${fresh.length ? card("Models found in other apps", "folder", `<div class="body">${importList(V.found.files)}<div class="row" style="margin-top:.75rem"><div class="grow"></div><button class="btn p" data-importgo>${ic("plus")}Take in the ticked models</button></div></div>`) : ""}`);
  } else if (V.step === 2){
    if (!V.picks){ put(el, `<h2 class="big">Pick a first model</h2><p class="lead">Finding popular models that fit…</p><div class="skel" style="height:8.75rem"></div>`); V.picks = (await api("setup/suggest").catch(() => ({picks: []}))).picks; }
    put(el, `<h2 class="big">Pick a first model</h2><p class="lead">${S.models.length ? `You have ${S.models.length} model${S.models.length === 1 ? "" : "s"} already. Add another, or go on.` : "Popular, well-made models that fit your graphics card. Find more any time under Find models."}</p>
      <div class="picks">${V.picks.map(p => `<div class="pickcard"><span class="badge acc" style="justify-self:start">${esc(p.label)}</span><b>${esc(p.model.repo.split("/")[1].replace(/-GGUF$/i, ""))}</b><div class="name">${esc(p.model.repo)}</div><div class="sub">${esc(p.why)} ${p.model.params}B parameters${p.model.vision ? ", sees images" : ""}${p.model.thinking ? ", thinks" : ""}.</div><button class="btn p sm" data-setuppick="${esc(p.model.repo)}" style="justify-self:start;margin-top:.375rem">${ic("dl")}Choose a size</button></div>`).join("") || `<div class="empty">Hugging Face can't be reached right now.</div>`}</div>
      <p class="sub" style="text-align:center">Downloads run in the background; watch them under Downloads.</p>`);
  } else {
    put(el, `<h2 class="big">You're set</h2><p class="lead">Here's where things are.</p>
      <div class="card" style="padding:.25rem 1rem;max-width:35rem;margin:0 auto .375rem"><div class="setting"><div class="grow"><b>Start at sign-in</b><div class="sub">Starts Waddle in the tray when you sign in, so apps can reach your models. No VRAM is used until a model is asked for.</div></div><label class="switch"><input type="checkbox" data-startup ${S.settings.startup ? "checked" : ""}><i></i></label></div>
      <div class="setting"><div class="grow"><b>Keep running in the tray when closed</b><div class="sub">On, closing the window leaves your models served from the tray; right-click the penguin to quit. Off, closing quits everything.</div></div><label class="switch"><input type="checkbox" data-set="tray" ${S.settings.tray ? "checked" : ""}><i></i></label></div></div><div class="picks">${[["chat", "Chat", "Talk to a model. It loads when you send."], ["arena", "Arena", "Compare models side by side."], ["models", "Models", "Settings, tuning, and quality checks."], ["connect", "Connect", "Use your models from pi, Claude Code, and other apps."]].map(([pg, t, d]) => `<button class="sug" data-setupdone="${pg}"><b>${t}</b>${d}</button>`).join("")}</div>`);
  }
}

async function hfMatch(names, always){
  const ask = [];

    try{ const r = await api("hf/match", {model}); if (r.linked){ if (r.message || always) toast(r.message || `${model} is linked to ${r.linked}.`); } else ask.push({model, file: r.file, choices: r.choices || []}); }

}

async function imageMake(over = {}){
  if (IMG.busy) return;
  const prompt = $("#iprompt").value.trim();
  if (!prompt) return toast("Describe the picture first.", true);
  const mode = over.mode || IMG.mode;
  if (mode === "img2img" && !IMG.init && !over.from) return toast("Choose a starting picture first: drop one in, paste one, or use one from the history.", true);
  const w = r8($("#iw").value), h = r8($("#ih").value), num = v => v === "" || v == null ? undefined : +v;
  imgSave();
  if (w * h > 2048 * 2048) toast("Large pictures take many minutes and a lot of video memory. Upscaling a smaller one is often faster and looks better.");
  const body = over.queued || {prompt, width: w, height: h, steps: num($("#isteps").value), cfg: num($("#icfg").value), seed: num($("#iseed").value), count: num($("#icount").value),
    sampler: $("#isampler").value, scheduler: $("#isched").value, negative: $("#ineg").value, lowmem: $("#ilowmem").checked, loras: IMG.loras, ...over};
  if (!over.queued && mode === "img2img" && !over.from){ body.init_image = IMG.init.data; body.source_name = IMG.init.name; body.strength = num($("#istr").value) ?? 0.6; if (IMG.mask) body.mask = IMG.mask; }
  delete body.mode; delete body.queued;
  if (over.toQueue){ delete body.toQueue; IMG.queue.push(body); imgQueueDraw(); return toast(`Queued. ${IMG.queue.length} waiting.`); }
  const recent = [prompt, ...store.get("img.recent", []).filter(x => x !== prompt)].slice(0, 30); store.set("img.recent", recent);
  IMG.busy = true; IMG.started = Date.now(); $("#igo")?.classList.add("busy"); imgStage(); imgPoll();
  try{
    const r = await api("images/make", body);
    IMG.batch = r.images; IMG.cur = r.images[0]; IMG.pics?.unshift(...r.images);
    toast(`Made ${r.images.length > 1 ? r.images.length + " pictures " : ""}in ${Math.round(r.seconds)} s.`);
  }catch(e){ toast(e.message, true); if ($("#iloop")) $("#iloop").checked = false; }
  IMG.busy = false; $("#igo")?.classList.remove("busy"); imgHist(); imgStage();
  // the queue goes on by itself, one setup after another
  if (IMG.queue.length){ const next = IMG.queue.shift(); imgQueueDraw(); return imageMake({queued: next}); }
  if ($("#iloop")?.checked && page === "images") setTimeout(() => imageMake({seed: undefined}), 400);
}

  if (e.target.id === "logfilter") showLog();
  if (e.target.id === "lognoise"){ store.set("log.noise", e.target.checked); showLog(); }
  if (e.target.id === "cin"){ growInput(); if (CH.cur) store.set("chat.draft." + CH.cur.id, e.target.value); }
  if (e.target.id === "cq"){
    CH.q = e.target.value; chatRows();
    // the words are looked up inside every chat too, a moment after typing stops
    clearTimeout(CH.qt); const q = CH.q.trim();
    CH.qt = setTimeout(async () => { if (q.length < 2){ CH.hits = []; return chatRows(); } try{ CH.hits = (await api("chats/search", {q})).hits; }catch{ CH.hits = []; } if (CH.q.trim() === q) chatRows(); }, 300);
  }
  if (e.target.id === "iq") inspectorSearch();
  if (e.target.id === "ihq") imgHist();
  if (e.target.id === "icmpr"){ const b = $(".icmpb"); if (b) b.style.width = e.target.value + "%"; }
  if (e.target.type === "range"){ const o = e.target.nextElementSibling; if (o?.tagName === "OUTPUT") o.textContent = e.target.value; }
  if (["istepsr", "icfgr", "icountr", "istrr"].includes(e.target.id)){ $("#" + e.target.id.slice(0, -1)).value = e.target.value; }
  const lw = e.target.dataset?.iloraw ?? e.target.dataset?.iloran;
  if (lw != null && e.target.value !== ""){ const l = IMG.loras.find(x => x.name === lw); if (l){ l.weight = +e.target.value; store.set("img.loras", IMG.loras); const other = e.target.dataset.iloraw != null ? $(`[data-iloran="${CSS.escape(lw)}"]`) : $(`[data-iloraw="${CSS.escape(lw)}"]`); if (other) other.value = e.target.value; } }
  if (["iw", "ih"].includes(e.target.id)) imgSizeDraw();
});
document.addEventListener("paste", e => {
  if (e.target.id === "cin" && e.clipboardData?.files.length){ e.preventDefault(); addFiles([...e.clipboardData.files]); }
  const pic = page === "images" && [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/"));
  if (pic){ e.preventDefault(); imgMode("img2img"); imgReadFile(pic); toast("Pasted as the starting picture."); }
});
document.addEventListener("dragover", e => { const z = e.target.closest?.("#idrop, .ileft"); if (z && e.dataTransfer?.types.includes("Files")){ e.preventDefault(); $("#idrop")?.classList.add("over"); } });
document.addEventListener("drop", e => { if (e.target.closest?.("#idrop, .ileft") && e.dataTransfer?.files.length){ e.preventDefault(); $("#idrop")?.classList.remove("over"); imgMode("img2img"); imgReadFile(e.dataTransfer.files[0]); } });
document.addEventListener("dragover", e => { if (e.target.closest?.(".cmain") && e.dataTransfer?.types.includes("Files")){ e.preventDefault(); $("#cbox")?.classList.add("drop"); } });
document.addEventListener("dragleave", e => { if (!e.relatedTarget?.closest?.(".cmain")) $("#cbox")?.classList.remove("drop"); });
document.addEventListener("drop", e => { if (e.target.closest?.(".cmain")){ e.preventDefault(); $("#cbox")?.classList.remove("drop"); addFiles([...e.dataTransfer.files]); } });

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && ["+", "=", "-", "0"].includes(e.key)){ e.preventDefault(); return setScale(e.key === "0" ? 1 : store.get("ui.scale", 1) + (e.key === "-" ? -0.05 : 0.05)); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); return $("#palette").classList.contains("on") ? closeAll() : palette(); }
  if (e.target.id === "cin" && e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); return chatSend(); }
  if (e.target.id === "iprompt" && e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); return imageMake(); }
  if (page === "images" && ["ArrowLeft", "ArrowRight"].includes(e.key) && !e.target.closest?.("input,textarea,select") && !$("#modal").classList.contains("on")){ e.preventDefault(); return imgStep(e.key === "ArrowRight" ? 1 : -1); }
  if (e.target.id === "pgprompt" && e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); return pgRun(); }
  if (e.target.id === "seq" && e.key === "Enter"){ e.preventDefault(); return seRun(); }
  if (e.target.id === "aprompt" && e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); return arenaRun(); }
  if (e.target.id === "afollowq" && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); return $("#afollowgo").click(); }
  if (e.key === "Escape" && CH.run && page === "chat" && !$("#modal").classList.contains("on")) return CH.run.ctrl.abort();
  if (e.key === "Escape" && page === "chat" && agentMode() && CH.cur.running && !$("#modal").classList.contains("on")) return chatSend();
  if (e.key === "Escape") return closeAll();
  if (e.key === "Enter" && ["hq","hauthor"].includes(e.target.id)){ hubRead(); hubSearch(); }
});
addEventListener("hashchange", () => { const p = location.hash.slice(1), m = p.match(/^hub\/(.+)$/); if (m){ if (page !== "hub") go("hub"); return hubOpen(decodeURIComponent(m[1])); } if (p !== page && NAMES[p]) go(p); });
// a new repo resets the picks in the drawer
const _hubOpen = hubOpen; hubOpen = async repo => { VIEWS.hub.sel = null; VIEWS.hub.files = null; return _hubOpen(repo); };

buildNav(); refresh().then(() => { if (deep) hubOpen(decodeURIComponent(deep[1])); if (deepModel) modelDrawer(decodeURIComponent(deepModel[1])); }); pollLive();
</script>
</body>
</html>
