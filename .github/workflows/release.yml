# Builds the release downloads when a version tag like v0.1.0-beta is pushed.
# Waddle's updater looks for these exact names.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo build --release   # MSVC links WebView2 in, so it's one file
      - run: choco install innosetup -y --no-progress
      - run: iscc "/DVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" packaging\windows\waddle.iss
      - run: copy target\release\waddle.exe target\dist\waddle-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/dist/Waddle-Setup.exe
            target/dist/waddle-windows-x64.exe
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libfuse2
      - run: cargo test
      - run: cd tests/ui && npm ci && npm test
      - run: |
          sudo curl -fsSLo /usr/local/bin/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          sudo curl -fsSLo /usr/local/bin/linuxdeploy-plugin-gtk https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          sudo chmod +x /usr/local/bin/linuxdeploy /usr/local/bin/linuxdeploy-plugin-gtk
      - run: bash packaging/linux/build-appimage.sh
      - run: cp target/release/waddle target/dist/waddle-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/dist/Waddle-x86_64.AppImage
            target/dist/waddle-linux-x64
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: bash packaging/macos/build-app.sh
      - run: cp target/dist/Waddle.app/Contents/MacOS/waddle target/dist/waddle-macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            target/dist/Waddle-macOS.zip
            target/dist/waddle-macos
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          version=${GITHUB_REF_NAME#v}
          if [ "${{ matrix.flavor }}" = cpu ]; then echo "list=$image:$version,$image:latest" >> "$GITHUB_OUTPUT"; else echo "list=$image:$version-vulkan,$image:vulkan" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false   # the release downloads are the only artifacts
        with:
          context: .
          file: packaging/docker/Dockerfile
          build-args: FLAVOR=${{ matrix.flavor }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
  # one job publishes, so the builds never race to create the release
  release:
    needs: [windows, linux, macos, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{windows,linux,macos}"
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: packaging/RELEASE_NOTES.md
          files: dist/*
